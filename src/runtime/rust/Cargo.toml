[package]
name = "ipe-runtime-rust"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "Ipe language runtime for Rust — primitives, collections, FFI"

[lib]
name = "ipe_runtime_rust"
path = "src/mod.rs"

[dependencies]
# Lexical path validation (clean / escapes_root / volume_name_len / disguise
# scan) lives in this crate's OWN `src/path_core.rs` sibling module, NOT an
# extern crate — so it vendors automatically with `mod ipe_runtime` into every
# emitted app (an extern crate would not survive that source-copy). The
# compiler's literal-path gate shares the SAME file via the `ipe_path_core` crate,
# which `include!`s `src/path_core.rs`, so the runtime seal and the compile-time
# gate cannot drift.
# `preserve_order`: `Json.Encode.object` takes an ordered `List (String, Value)`
# whose order is part of the contract; the `Map` must keep insertion order rather
# than sort keys, so serialization emits keys in the order given.
serde_json = { version = "1", features = ["preserve_order"], optional = true }
jsonwebtoken = { version = "9", optional = true }
# `crypto_core.rs` (the cryptographic floor: SHA-2 hash + HMAC family + typed
# Key/Mac + entropy pair + constant-time compare) is behind the `crypto-core`
# feature: a program that reaches no crypto-floor kernel — and no crypto / jwt /
# db / web / webview / email / server surface that reaches the floor — drops the
# module and this whole subtree (`sha2` / `hmac` / `subtle` +
# `digest` / `block-buffer` / `crypto-common` / `generic-array` / `typenum` /
# `cpufeatures`). The heavy RSA arms inside `crypto_core.rs` stay behind the
# `crypto` feature (which implies `crypto-core`).
sha2 = { version = "0.10", optional = true }
rsa = { version = "0.9", features = ["sha2"], optional = true }
aes-gcm = { version = "0.10", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
pbkdf2 = { version = "0.12", optional = true }
flate2 = { version = "1", optional = true }
zstd = { version = "0.13", optional = true }
csv = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
serde_yaml = { version = "0.9", optional = true }
axum = { version = "0.7", features = ["ws"], optional = true }
tower-http = { version = "0.5", features = ["fs", "catch-panic", "timeout"], optional = true }
# `tower` (limit + util) backs the server front-door DoS ceilings:
# `GlobalConcurrencyLimitLayer` (in-flight cap) needs `limit`; `ServiceExt`
# (`util`) drives a `Router` through a single request in the server unit tests.
# Gated by the `server` feature — absent from wasm/library builds and never
# propagated to emitted projects (they build their own manifest).
tower = { version = "0.5", features = ["limit", "util"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"], optional = true }
# `url`: optional, behind the `url` feature. Backs the `Ipe.Url` typed-URL
# module (`url.rs`, the parse-don't-validate seal + `form_urlencoded` query
# builder) and the reqwest-free `ssrf` module's parser (reqwest re-exports this
# exact crate as `reqwest::Url`, so it resolves to the same lockfile node — no
# extra dependency). Gated so a program that reaches no URL/SSRF/HTTP/WebSocket
# surface drops the idna/ICU4X subtree, matching the emitted floor (`url` is
# appended only under `uses_url`, never in the base manifest).
url = { version = "2", optional = true }
# `tinyvec` is a transitive dep of `idna` (pulled by `url 2.x`). Version 1.13.0
# introduced a use of `vec!` that requires the `std` feature to be active; without
# it the emitted project's fresh `cargo build` fails with "cannot find macro `vec`
# in this scope". Declaring it here with `features = ["std"]` forces the feature
# on via cargo's feature-unification so every emitted project that carries this
# runtime gets a working `tinyvec`. Optional so it is absent from dep graphs that
# do not activate `url`.
tinyvec = { version = "1", features = ["std"], optional = true }
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "pool", "tokio1", "tokio1-rustls-tls"], optional = true }
# `rustls-tls-webpki-roots`: enables `MaybeTlsStream::Rustls` so `wss://`
# connections use the same rustls backend as reqwest/sqlx/lettre — no native
# TLS dependency added. The `native-tls` feature is deliberately NOT listed;
# rustls-only TLS: no native-tls dependency added (deliberate divergence: §B-WS-TLS).
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", optional = true }
# The floor types (`IpeMaybe`/`IpeResult` in `core.rs`, the `IpeError` family in
# `error.rs`, `IpeOrder` in `basics.rs`, `Decimal`, the `dom::diff::Patch` wire)
# derive `serde::Serialize`/`Deserialize` — but each derive is gated on the
# `serde` feature (`#[cfg_attr(feature = "serde", derive(…))]`). The derives are
# generic-BOUND (`impl<T: Serialize> …`), so a non-serde inner type is unaffected;
# the ONLY coupling is that the `serde` crate must be in the graph. Every
# serializing surface (json/web/db/config/email/http/ws/…) implies `serde`, so a
# floor type crossing a wire always has its impls present; a program that reaches
# no serializing surface drops `serde` and the whole 7-crate proc-macro stack.
serde = { version = "1", features = ["derive"], optional = true }
# Typed form-record decode (`dom/form.rs`, gated on `web`/`wasm-client`). Optional,
# listed by `web` and `wasm-client` (its only consumers); a non-web program drops
# it and its `form_urlencoded` subtree.
serde_urlencoded = { version = "0.7", optional = true }
# Constant-time compare: the `crypto_core` floor's `constantTimeEqual`, the
# `secret.rs` `Secret` compare, and the `web`/`server` CSRF/session-id compares.
# Optional, behind `crypto-core` (and `secret`, which implies `crypto-core`): a
# program that reaches neither the crypto floor nor a `Secret` drops it.
subtle = { version = "2", optional = true }
# OS CSPRNG for the `crypto_core` entropy pair (`Crypto.randomBytes` /
# `randomToken`), `random.rs`'s seed, and every scratch name the always-present
# `scratch_core` primitive creates (the `File.tempFile`/`tempDir` kernels, the
# console store, atomic-replace siblings). The wasm32 target block below adds
# the `js` feature (backing `getrandom` with `crypto.getRandomValues`); cargo
# unions the two, so native uses the OS source and the browser uses its
# substitute — neither pulls `aes-gcm` for entropy. Non-optional: an
# unguessable temp name is a security floor every program carries.
getrandom = { version = "0.2" }
# `Ipe.Secret`: zeroizes the backing buffer on `Drop` so a revealed/discarded
# secret does not linger in freed heap memory. Optional, behind the `secret`
# feature: a program that reaches no `Secret` drops `secret.rs` and `zeroize`.
zeroize = { version = "1", optional = true }
# HMAC family — the `crypto_core` floor's `hmacSha256`/`hmacSha512`. Optional,
# behind `crypto-core`.
hmac = { version = "0.12", optional = true }
# Legacy SHA-1 / MD5 checksums (`Crypto.sha1`/`md5`) live in `crypto.rs`, the
# heavy surface — optional, behind the `crypto` feature.
sha1 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
# The driver features (`sqlite`/`postgres`) are activated by the `db-sqlite` /
# `db-postgres` selectors, not enabled here — a program pulls only the driver
# it emits. `db-postgres` also activates `sqlite` (the Live session store keeps
# a sqlite side table even under the postgres driver — see `db_cargo_toml`).
sqlx = { version = "0.8", features = ["runtime-tokio-rustls"], optional = true }
redis = { version = "0.27", features = ["tokio-comp"], optional = true }
# `Ipe.Regex` regex kernels + `String.isUrl`, behind the `regex` feature. A
# program that reaches neither drops `regex` and its aho-corasick / regex-automata
# / regex-syntax subtree.
regex = { version = "1", optional = true }
# Exact Unicode General_Category lookup. Optional, behind the `char-category`
# feature: the `char_category.rs` module (the `Ipe.Char` `isAlpha`/`isDigit`/
# `isLower`/`isUpper`/`isAlphaNum` predicates) is its sole consumer. Those
# predicates key off precise GCs (Nd / L* / Ll / Lu), narrower than Rust std's
# `char::is_numeric`/`is_lowercase`/`is_uppercase` (which fold in No/Nl,
# Other_Lowercase, Other_Uppercase). A program that reaches none of them drops
# the crate; the std-only `Ipe.Char` kernels (`char_kernel.rs`) stay compiled.
unicode-general-category = { version = "1", optional = true }
# base64 / hex / percent-encoding: the `Ipe.Encoding` codecs + `Ipe.Bytes`
# buffer kernels, behind the `encoding` feature. Also used by the raw crates in
# the crypto/db/server/email/jwt/web surfaces — those features each imply
# `encoding`. A program that reaches none of these drops all three crates.
base64 = { version = "0.22", optional = true }
# `Ipe.Uuid` v4/v7/parse, behind the `uuid` feature. The `server` / `web`
# surfaces mint session/CSRF ids via `uuid::new_v4` (they imply `uuid`); a bare
# Program that reaches none drops the crate.
uuid = { version = "1", features = ["v4", "v7"], optional = true }
hex = { version = "0.4", optional = true }
percent-encoding = { version = "2", optional = true }
# `chrono` (base calendar/clock) is optional, behind the `time-core` feature.
# Its two always-emittable consumers — `log.rs` (RFC3339-nano log timestamp) and
# `time.rs` (the `Ipe.Time` calendar surface) — are each feature-gated, and the
# db/web/webview surfaces render `chrono` timestamps too. A program that reaches
# no Log/Time kernel and no Db/Web/WebView surface drops `chrono` entirely.
# Pinned exact: a loose `0.4` caret lets an emitted crate (which resolves its own
# dep graph) drift `chrono` to a newer patch whose transitive `wasm-bindgen`
# floor climbs past the exact `wasm-bindgen = "=0.2.126"` pin below, breaking the
# resolve. Freezing `chrono` to the one version the whole graph reconciles to
# makes every emitted resolve deterministic and keeps `wasm-bindgen = 0.2.126`
# the unifiable point version.
chrono = { version = "=0.4.45", optional = true }
# `chrono-tz` (the embedded IANA zone DB) is optional: only the `time` runtime
# module's IANA-zone helpers use it, and they are gated behind the `time`
# feature (which implies `time-core`, since the zones build on base `chrono`). A
# program that reaches no `Ipe.Time` kernel drops the crate.
chrono-tz = { version = "0.10", optional = true }
# `rust_decimal` (with its `arrayvec` mantissa buffer): optional, behind the
# `decimal` feature. Backs `decimal.rs` (the `Ipe.Decimal` surface) and `money.rs`
# (`Ipe.Money`, built on `Decimal`); the `db` surface also decodes numeric columns
# through it, so `db` implies `decimal`. A program that reaches no Decimal/Money
# kernel and no Db surface drops the crate. `rust_decimal`'s own `serde` half is
# NOT enabled here — it activates weakly via the `serde` feature
# (`serde = [… "rust_decimal?/serde"]`), so `Decimal`'s inner `RD` gains serde
# impls only when both `decimal` and `serde` are selected. `default-features =
# false` drops `rust_decimal`'s own default `serde` link, so a decimal-only program
# (no `serde`-selecting surface) sheds the serde crate too; `std` and `maths` are
# re-selected explicitly — `std` for the owned `Decimal` display/parse the runtime
# uses, `maths` for the `powi`/rounding the `Ipe.Money` surface calls.
rust_decimal = { version = "1", optional = true, default-features = false, features = [
    "std",
    "maths",
] }
bcrypt = { version = "0.17", optional = true }
# `icu_casemap`: locale-aware case mapping (`String.toUpperIn`/`toLowerIn`).
# Feature-gated so programs that never use locale-aware case pay nothing.
# Uses ICU4X compiled-data bundling — no separate data-provider call needed.
icu_casemap = { version = "2.2", optional = true }
icu_locale_core = { version = "2.2", optional = true }
async-trait = { version = "0.1", optional = true }
unicode-width = { version = "0.1", optional = true }
crossterm = { version = "0.29", optional = true }
# Ipe.Webview native window. Modern wry/tao (objc2 + current windows-rs) build on
# macOS-15/Xcode-16 + Windows-2025; on Linux they target webkit2gtk-4.1 + libsoup-3.0.
wry = { version = "0.55", optional = true }
tao = { version = "0.35", optional = true }

# Unix-only syscalls go through rustix's safe wrappers — no hand-written `unsafe`
# FFI. `pty` + `termios`: `Ipe.Process.runInPty` allocates a pseudo-terminal
# (openpt / grantpt / unlockpt / ptsname) and sizes it (tcsetwinsize), and
# `Io.readSecret` toggles terminal echo (isatty / tcgetattr / tcsetattr).
# `process`: the child parent-death floor (`prctl(PR_SET_PDEATHSIG)`, Linux)
# and the descriptor floor's `getrlimit` bound; `fs` also lists the open
# descriptors (`/proc/self/fd` walk, `/dev/fd` probe) the floor marks close-on-exec.
# `fs` backs `open`ing the pty replica and `scratch_core`'s `O_NOFOLLOW` open
# and entry-owner facts (checked against `process`'s effective uid/gid); `std`
# re-exports `OwnedFd`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["pty", "termios", "fs", "process", "std"] }

# tokio is native-only. Every tokio code path in this crate is already
# `not(target_arch = "wasm32")`-gated at the use site (the wasm target drives
# the same `IpeCmd`/`IpeSub` types through the `wasm-client` sink, never a tokio
# loop), so declaring the dependency in the native-only target table means any
# tokio-enabling feature (`async`, `db`, `tui`, `server`, `web`, `debugger`, …)
# resolves to nothing on wasm32 — its `dep:tokio` reference is absent from the
# wasm dependency graph. This keeps `--features wasm-client,debugger` (a wasm
# build that transitively selects `async`) from pulling tokio, which does not
# compile on `wasm32-unknown-unknown`. The `feature = "tokio"` cfg flag is still
# set on wasm when a tokio-enabling feature is selected, so every `tokio::` use
# site is guarded by BOTH `feature = "tokio"` AND `not(target_arch = "wasm32")`.
# Narrow feature set matching the emitted floor async runtime (project.rs
# `async_runtime_cargo_toml`): `rt`/`rt-multi-thread`/`macros`/`time`, plus
# `sync` (the shared Cli/Tui event loop `tea.rs` — compiled under the `tokio`
# feature — uses `tokio::sync::mpsc`). The `net` arm is added only by the
# `server`/`web`/`websocket_client` surface features. `full` is deliberately
# NOT used here so depending on the crate does not pull all of tokio.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"], optional = true }

# wasm32 floor: uuid's entropy backend needs the getrandom js shim in the
# browser; `js` is a no-op on native targets so scoping it here keeps the
# native feature graph identical.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["v4", "v7", "js"] }
# `Random.*` / `Crypto.randomBytes` / `Crypto.randomToken` browser substitute:
# the `js` feature backs `getrandom()` with `crypto.getRandomValues` (the exact
# mechanism `docs/adr/0005-delivery-shapes-runtimes-hosts-targets.md` Q3 names). Direct dep (not just
# transitively via uuid) so `random.rs`/`crypto.rs` can call it without pulling
# `aes-gcm` just for its `OsRng` re-export.
getrandom = { version = "0.2", features = ["js"] }
# Browser sink (`wasm` module, feature `wasm-client`). Pinned exact
# wasm-bindgen: the emitted-project glue is produced by the wasm-bindgen CLI,
# which requires a byte-matching crate version. THIS is the canonical
# wasm-bindgen version spelling — the emitted-project manifest templates and
# the CLI's install-instructions message each repeat it (a `Cargo.toml`
# dependency table can't `include!`/import a version from elsewhere), and
# `ipe_backend_rust::project`'s `wasm_bindgen_version_matches_the_runtime_pin`
# test fails the build the instant one of those copies drifts from this line.
wasm-bindgen = { version = "=0.2.126", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
# `Sub.every` / `Time.sleep` / `Time.every` browser substitute — `setInterval`
# / `setTimeout` wrapped as futures/callbacks (M4 Cmd/Sub bridge).
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "Node",
    "Text",
    "Event",
    "EventTarget",
    "console",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlFormElement",
    "FormData",
    "KeyboardEvent",
    # Debugger overlay: a keyboard toggle, a draggable floating window (pointer
    # events + element geometry), and per-element inline style writes.
    "PointerEvent",
    "DomRect",
    "CssStyleDeclaration",
    "Location",
    "HtmlDocument",
    # `CustomElement.node` wasm-client up-event: the glue dispatches a typed `CustomEvent`
    # whose `detail` carries the encoded `up`; the sink reads it via checked
    # `dyn_ref::<CustomEvent>` and folds the fail-closed-decoded msg into `update`.
    "CustomEvent",
    # M4 Cmd/Sub browser bridge: fetch (Http.get/post/request) + WebSocket
    # client (Ipe.WebSocket).
    "Request",
    "RequestInit",
    "RequestMode",
    "RequestRedirect",
    "Response",
    "Headers",
    # Incremental (capped) response-body read: `Response.body()` →
    # `ReadableStream.get_reader()` → chunk loop, so an untrusted body is bounded
    # by construction rather than fully buffered by `Response.text()`.
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "AbortController",
    "AbortSignal",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "BinaryType",
    # Client-side routing: History API + popstate event.
    "PopStateEvent",
    "History",
] }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
# Every feature that enables `tokio` also enables `random`: `task.rs`'s
# tokio-gated retry-with-jitter path draws from `random`'s LCG
# (`super::random::lcg_next`), so the `random.rs` module must be present whenever
# the async runtime is. Keeps the graph closed at `--no-default-features` for any
# single tokio-enabling feature.
async = ["tokio", "random"]
# The `Ipe.Url` typed-URL module + the reqwest-free `ssrf` validators. Pulled
# by every surface that parses URLs (http_client / websocket_client / email /
# web) and selectable standalone. A program that reaches no URL surface drops
# the `url` crate (and its idna/ICU4X closure) entirely.
url = ["dep:url", "dep:tinyvec"]
# Locale-aware case mapping (`String.toUpperIn`/`toLowerIn`/`Locale.fromTag`).
# Programs that never import `Ipe.Locale` pay nothing — the ICU4X casemap +
# locale-core deps are entirely absent from the default feature graph.
locale = ["dep:icu_casemap", "dep:icu_locale_core"]
# Base `chrono` (calendar/clock) + the `time.rs` module. Enabled by any surface
# that renders a `chrono` timestamp: `log` (the RFC3339-nano log line), an
# `Ipe.Time` kernel (`time` implies this), or the `db`/`web` surfaces (migration
# ledger + Live session store timestamps). A program that reaches none drops
# `chrono`. Separate from `time` so a `Time`-free program that only logs still
# drops the heavier IANA zone DB.
time-core = ["dep:chrono"]
# `log.rs` (`Ipe.Log.*` observability). Its RFC3339-nano timestamp is the one
# always-emittable `chrono` consumer, so `log` pulls base `chrono` via
# `time-core`. `Debug.log` (`debug.rs`, a pure passthrough) is NOT gated here.
log = ["time-core"]
# Ipe.Time IANA-zone calendar surface (`time.rs`'s zone helpers). Gated so a
# program that reaches no `Ipe.Time` kernel drops the embedded IANA zone DB. The
# zones build on base `chrono`, so `time` implies `time-core`.
time = ["dep:chrono-tz", "time-core"]
# `Ipe.Encoding` codecs + `Ipe.Bytes` buffer kernels: the `base64` + `hex` +
# `percent-encoding` crates and the `encoding.rs` / `bytes.rs` modules. Every
# surface that uses the raw codec crates implies this (crypto/db/server/email/jwt/
# web); a program that reaches none of them drops `base64` + `hex`. The floor
# `crypto_core::crypto_random_token` uses an INLINE base64url encoder (no crate),
# so it stays available at `--no-default-features` for the always-emitted prelude
# wrapper — it is deliberately NOT a consumer of this feature.
encoding = ["dep:base64", "dep:hex", "dep:percent-encoding"]
# `Ipe.Regex` kernels + `String.isUrl` (whose validator lives in
# `regex_kernel.rs`): the `regex` crate and its aho-corasick / regex-automata /
# regex-syntax subtree. A standalone leaf — no surface implies it. A program that
# reaches neither an `Ipe.Regex` kernel nor `String.isUrl` drops all four crates.
regex = ["dep:regex"]
# `Ipe.Uuid` v4/v7/parse: the `uuid` crate and the `uuid_kernel.rs` module. The
# `server` / `web` surfaces mint session/CSRF ids via `uuid::new_v4`, so both
# imply `uuid`; a bare Program that reaches no `Ipe.Uuid` kernel drops the crate.
uuid = ["dep:uuid"]
# `Ipe.Random` non-cryptographic PRNG: gates the `random.rs` module, whose
# seed draws from the always-present `getrandom`.
random = []
# The cryptographic floor: `crypto_core.rs` (SHA-2 hash + HMAC + RSA-gated arm +
# constant-time compare + entropy pair + typed Key/Mac). Pulls `sha2` / `hmac` /
# `subtle` and their subtrees (`getrandom` is always present), plus `encoding` (the floor's inline
# base64url encoder is crate-free, but the heavy `crypto`/`jwt` consumers that
# imply `crypto-core` also need the codec crates, so folding `encoding` here keeps
# the graph closed at `--no-default-features`). Every heavier crypto surface
# (`crypto`/`jwt`) and every floor-reaching surface (`db`/`web`/`email`/`server`)
# implies this.
crypto-core = ["dep:sha2", "dep:hmac", "dep:subtle", "encoding"]
# `Ipe.Secret` opaque secret-string module (`secret.rs` + `zeroize`). Implies
# `crypto-core` for the shared `subtle` constant-time compare. A program that
# reaches no `Secret` drops `secret.rs` + `zeroize`.
secret = ["dep:zeroize", "dep:subtle", "crypto-core"]
# `Ipe.Decimal` + `Ipe.Money`: the `rust_decimal` crate (and its `arrayvec`
# subtree) plus the `decimal.rs` / `money.rs` modules. `money.rs` builds on
# `decimal.rs`'s `Decimal`, so one feature gates both. The `db` surface decodes
# numeric SQL columns through `rust_decimal`, so `db` implies this. A program
# that reaches no `Decimal.*`/`Money.*` kernel and no `Db` surface drops the crate.
decimal = ["dep:rust_decimal"]
# `Ipe.Char` General_Category predicates (`isAlpha`/`isDigit`/`isLower`/`isUpper`/
# `isAlphaNum`): the `unicode-general-category` crate + the `char_category.rs`
# module. A standalone leaf — no surface implies it. A program that reaches only
# the std-only `Ipe.Char` kernels (or none) drops the crate.
char-category = ["dep:unicode-general-category"]
# The serde crate itself — the derive/impl floor. Optional and gated: a program
# that reaches no serializing surface drops it (and the ~7-crate serde_derive →
# syn/quote/proc-macro2 proc-macro stack). The floor derives are
# `#[cfg_attr(feature = "serde", derive(…))]`, so `IpeMaybe`/`IpeResult`/
# `IpeError`/`IpeOrder`/`Decimal`/`Patch` compile impl-free without it. Every
# serializing surface below lists `serde`, so a floor type crossing a wire always
# has its impls. The weak `rust_decimal?/serde` activates the inner decimal serde
# half ONLY when `decimal` is also selected — `serde` alone introduces no dep.
serde = ["dep:serde", "rust_decimal?/serde"]
# `json` is the JSON codec surface (`serde_json`); it implies `serde` (the
# `serde_json::Value` stringify + every `IpeMaybe`/record round-trip need the
# derives). It must NOT drag `jsonwebtoken` (+ ring) into a plain JSON program —
# the JWT surface is the separate `jwt` feature.
json = ["dep:serde_json", "serde"]
# `sha2` (the `_ipe_migrations` ledger checksum, a cross-backend byte-exact DB
# contract) rides the `crypto-core` feature `db` lists below. `tokio/sync`:
# `db.rs`, `telemetry_spill.rs`, and the `tea` loop use `tokio::sync`. BOTH the
# `sqlite` and `postgres` sqlx drivers link with `db`: the vendored Live session
# store (`web/store.rs`) references `SqlitePool` AND `PgPool` under `db`, and the
# emitted `db_cargo_toml` likewise always keeps `sqlite` and adds `postgres` for
# a postgres project (the session store keeps a sqlite side table on every
# driver). Which driver a program actually *uses* is chosen by `config.rs` — the
# emitter's `config_postgres.rs` overlay for postgres — not by dropping a sqlx
# driver feature.
# `time-core`: `db.rs`'s migration-ledger `applied_at` and `telemetry_spill.rs`'s
# retention cutoff stamp `chrono::Utc::now()` timestamps. `decimal`: `db.rs`
# decodes numeric SQL columns (and `Db.Decode.money`) through `rust_decimal` +
# the `Decimal` newtype.
# `crypto-core`: `db.rs` SHA-256s the `_ipe_migrations` ledger checksum (a
# cross-backend byte-exact contract).
# `tokio/net`: the `ssrf` gate resolves a Postgres host through
# `tokio::net::lookup_host` (non-blocking, deadline-bounded).
db = ["sqlx", "sqlx?/sqlite", "sqlx?/postgres", "tokio", "tokio/sync", "tokio/net", "dep:serde_json", "json", "serde", "encoding", "random", "time-core", "decimal", "crypto-core", "url", "secret"]
# `db-sqlite` / `db-postgres`: config.rs alias selectors. Only the emitter ever
# enables one, and it selects exactly one (SEAL-checked) — the standalone crate
# links both sqlx drivers regardless (see `db`). The `compile_error!` in
# `config.rs` guards the union as a fail-closed guard, not a user surface.
db-sqlite = ["db"]
db-postgres = ["db"]
redis_store = ["redis", "tokio", "tokio/sync", "dep:serde_json", "json", "serde", "async-trait", "random"]
# Heavy crypto surface (`crypto.rs`): legacy SHA-1/MD5 checksums, AEAD, PBKDF2,
# RSA. Owns `sha1` + `md-5` (crypto.rs-only) and implies `crypto-core` (the RSA
# arm, the `Key` reveal, and the re-exported floor all live there).
crypto = ["rsa", "bcrypt", "aes-gcm", "chacha20poly1305", "pbkdf2", "dep:sha1", "dep:md-5", "encoding", "crypto-core"]
# `jwt`: the JWT encode/decode surface (`jwt.rs`, `all(json, crypto)`-gated).
# Splits `jsonwebtoken` (+ its ring closure) out of the floor `json` feature so
# a plain JSON program does not link it. `auth.rs` (register/login) also needs
# this surface. Implies both `json` and `crypto`, matching the module gate.
# `jwt.rs` signs with `crypto_core`'s HMAC/RSA (via `crypto`, which implies
# `crypto-core`) and wraps its `Algorithm` in a `secret::Secret`, so it implies
# `secret` (which itself implies `crypto-core`).
# `auth.rs` (compiled under `#[cfg(feature = "jwt")]`) calls
# `uuid::Uuid::new_v4()` to mint per-session `jti` ids — so `jwt` implies
# `uuid`. A jwt-or-auth program that reaches no direct `Ipe.Uuid` kernel still
# needs the crate for `auth_sign_token`'s entropy call.
jwt = ["json", "crypto", "secret", "dep:jsonwebtoken", "uuid"]
compression = ["flate2", "zstd", "tokio", "random"]
csv_kernel = ["csv", "tokio", "random"]
cache_kernel = ["tokio", "random"]
# `tokio`: tea.rs (the shared Cli/Tui event loop, pulled by tui/app.rs) uses
# `tokio::sync::mpsc`. Without it the standalone `--features tui` build fails to
# resolve the `tea` module + `tokio`.
tui = ["unicode-width", "crossterm", "tokio", "random"]
# The server-free render core: the target-neutral `crate::dom` diff/dispatch/form
# pipeline, the `web::style_inject`/`page_shell` render helpers, and the
# `dom::req::WebReq` init context — everything a patch consumer needs to render an
# `Html` tree and resolve DOM events to Msgs, with NO axum HTTP `server`, no SSE,
# and no session store. It is the floor shared by every render host: the served
# `web` surface, the browser-WASM `wasm-client` sink, AND the native-window
# `webview` backend all imply it. A render-core `#[cfg]` in the source keys off
# THIS feature (not `web`), so the core compiles wherever any of the three is
# selected. `serde_json` backs the webview IPC parse + the floor wire; `json`
# pulls `serde` (the `Patch`/`FormData` derives); `serde_urlencoded` is the typed
# form-record decode (`dom/form.rs`); `encoding` is the strict percent-decoder
# the route matcher decodes each path segment with (`web/route.rs`).
web-core = ["dep:serde_json", "json", "serde", "dep:serde_urlencoded", "encoding"]
# Real native-window Webview backend (opt-in; needs the system webview dev libs).
# NOT in `full` — default/CI builds compile the cross-platform stub instead.
# Pulls ONLY the server-free `web-core` render core (the `Html` renderer +
# event-dispatch `HandlerIndex` + `page_shell`/`style_inject` the in-process IPC
# bridge reuses) — NOT the full `web` feature and NOT the axum `server`: the
# desktop-webview delivery renders over a LOCAL IPC bridge and runs no HTTP
# server. `tokio` (the current-thread `block_on` the generated entry drives the
# event loop through) is named explicitly since `web` no longer supplies it;
# `random` rides it because `task.rs`'s tokio-gated retry-with-jitter path draws
# from `random`'s LCG (`super::random::lcg_next`) — every tokio-enabling feature
# must also enable `random` or the module is absent (same invariant as `async`).
# The no-server floor is machine-checked by `tests/webview_dep_floor.rs`.
webview = ["wry", "tao", "web-core", "tokio", "random"]
config = ["json", "toml", "serde_yaml"]
# `tokio/net`+`tokio/sync`: axum binds a listener (`tokio::net`) and the
# server/live loop uses `tokio::sync`.
# `crypto-core`: `server.rs` constant-time compares session ids via `subtle`.
server = ["tokio", "tokio/net", "tokio/sync", "axum", "tower-http", "tower", "futures-util", "encoding", "uuid", "random", "crypto-core"]
# The reqwest-free `ssrf` module parses URLs via the `url` crate (which reqwest
# re-exports as `reqwest::Url`); `url` is behind the `url` feature.
# `serde`: `http_stream.rs` derives Serialize/Deserialize on its SSE event
# wire types.
# `tokio/net`: the `ssrf` gate resolves hosts through `tokio::net::lookup_host`.
http_client = ["tokio", "tokio/net", "reqwest", "futures-util", "url", "random", "serde", "encoding"]
# `http_client`: email.rs reuses `http_client::ssrf_apply` for outbound-request
# SSRF hardening, so it needs the http_client module present. (`sha2` is a
# non-optional base dep now.)
# `crypto-core`: `email.rs` HMAC-SHA-256s the SMTP auth.
# `secret`: `email.rs` takes the SMTP password as a `crate::secret::Secret`, so
# the `secret` module must be present whenever the email surface is imported.
email = ["tokio", "reqwest", "lettre", "dep:serde_json", "json", "serde", "http_client", "encoding", "crypto-core", "secret"]
# ws needs ONLY the reqwest-free ssrf validators (which use `url`, behind the
# `url` feature), NOT the reqwest HTTP client — so it does not pull
# `http_client`. `tokio/net`: `ws_client.rs` opens the pinned TCP socket.
# `serde`: `ws_client.rs` derives Serialize/Deserialize on its frame wire types.
websocket_client = ["tokio", "tokio/net", "tokio/sync", "tokio-tungstenite", "futures-util", "url", "random", "serde"]
# The session-id / CSRF-token RNG draws from the OS CSPRNG via `uuid`, so `web`
# needs no `aes-gcm`; `subtle` (constant-time compare) and `sha2` (client-JS SRI
# integrity hash) ride the `crypto-core` feature `web` lists below. `serde` (the
# floor-type wire derives) + `serde_urlencoded` (typed form-record decode, whose
# `dom/form.rs` module is web/wasm-gated) are listed here — the Live wire is the
# consumer of both. `tokio/signal`+`tokio/process`: the Live console reverse-proxy
# (`web/console_proxy.rs`, `web/mod.rs`) spawns a child (`tokio::process`) and
# handles signals (`tokio::signal`) — matching the emitted `web_cargo_toml`
# live-runtime tokio feature set.
# `time-core`: `web/store.rs` (Live session store) and `web/hub.rs`/`web/mod.rs`
# (console-proxy + hub timestamps) render `chrono` instants. `webview` implies
# `web`, so the native-window backend carries it transitively.
# `crypto-core`: `web/mod.rs` SHA-256s the client-JS SRI integrity hash and
# `web/csrf.rs` constant-time compares CSRF tokens via `subtle`.
# `http_client` is absent: the web/server modules make no outbound HTTP calls.
# A web app with an HTTP kernel (`uses_http`) or email selects `http_client`
# through `reaches_http_client()` in the backend — reqwest never enters a plain
# web app.
web = ["web-core", "widget-assets", "server", "dep:serde_json", "json", "serde", "dep:serde_urlencoded", "async-trait", "tokio/signal", "tokio/process", "tokio/io-util", "encoding", "uuid", "time-core", "crypto-core"]
# The `CustomElement.node` custom-element glue generator + SRI-pinned asset addressing
# (`widget_assets.rs`) as a STANDALONE surface, decoupled from the heavy `web`
# server. `sha2` (content digest) rides `crypto-core`; `base64` (the SRI value)
# rides `encoding`. The native CLI's static/wasm bundler compiles the runtime
# with ONLY this feature to drive the ONE glue generator over the widget manifest
# at build time — the same code the server path calls, no second glue. `web`
# implies it so the server keeps `ipe_runtime::web::widget_assets::*` unchanged.
widget-assets = ["crypto-core", "encoding"]
# `db-postgres` (not bare `db`) selects a concrete sqlx driver — it also pulls
# `sqlite`, so both driver code paths compile. `jwt` + `url` cover the
# JWT/auth and URL/SSRF surfaces that `db`/`web`/`http_client` reach.
full = ["async", "json", "jwt", "url", "db", "db-postgres", "redis_store", "crypto", "crypto-core", "secret", "compression", "csv_kernel", "cache_kernel", "tui", "config", "server", "http_client", "email", "websocket_client", "web", "time", "log", "regex", "uuid", "random", "decimal", "char-category"]
# Development-only time-travelling debugger core (recorder / re-fold / export /
# import). NOT in `full` and NOT implied by `wasm-client` — the debugger is a
# build-mode opt-in (`ipe dev build/run --debugger`), never a default. `ipe release`
# refuses `--debugger`, so this feature is always absent from production artifacts.
# Implies `json` (the seal-codec export/import path) and `serde` (the Msg
# seal-legality gate). Also implies `async` (which enables `tokio`) so the `tea`
# module (`IpeCmd`/`IpeSub`) is available — the recorder references `IpeCmd` in
# its `record` and `reconstruct` signatures. The core module is unconditional on
# target; the wasm-client hook into `wasm/mod.rs` is additionally target-cfg'd to
# `wasm32` (and `wasm-client` implies `tea` independently via `wasm-client`).
# Also implies `crypto-core`: the `control` module's loopback transport
# authenticates its per-session token with the constant-time `ct_eq` predicate
# (gated on `crypto-core`), so a debugger-only build still carries a timing-safe
# token check. `web` already pulls `crypto-core`, so the wire is uniform.
# `tokio/net` + `tokio/io-util`: the `control::server` loopback accept-loop
# (bound only under a dev-loop surface) reads/writes length-delimited frames over
# a `tokio::net::TcpStream`. `web` reaches the same server via its `server`
# feature (which already pulls `tokio/net`); adding `io-util` to both keeps the
# accept-loop's `AsyncRead`/`AsyncWrite` extension traits available in either
# dev-loop build. Both are native-only surfaces; the wasm dev-loop carries no
# control socket.
# The dev-loop control WIRE + its loopback accept-loop when a tokio runtime is
# already present. The `ControlFrame` codec + the `transport` primitives (bind
# addr, constant-time token check, env reads) are always available; `ipe dev watch`
# (the parent sender) links THIS ALONE to build/parse frames over its own std
# sockets, reusing the ONE wire definition (SSOT) without pulling tokio/async
# into the CLI. The `control::server` accept-loop is gated
# `all(feature = "tokio", not(wasm32))` and reads/writes over `tokio::net` +
# `tokio::io`, so the WEAK `tokio?/net` + `tokio?/io-util` add those tokio arms
# ONLY when some other feature already enabled `tokio` — the tui/cli/worker
# dev-loop child (`tui` ⇒ `tokio`), or `web`/`debugger` (which also imply
# `control-wire`). The weak form is load-bearing: it keeps a bare `control-wire`
# link (the tokio-free CLI) from activating the optional `tokio` dep, so the
# parent still pulls no async runtime, while a default `ipe dev watch` tui child —
# which selects `control-wire` alongside `tui` — compiles the accept-loop to
# mount the appearance hot-swap socket. Implies `json` (the codec's serde_json
# body) + `crypto-core` (the `is_authorized` constant-time compare); `json` pulls
# `serde` (the frame derives).
control-wire = ["json", "serde", "crypto-core", "tokio?/net", "tokio?/io-util"]
debugger = ["control-wire", "async", "tokio/net", "tokio/io-util"]
# The dev-loop build intent (`ipe dev build` / `ipe dev run` / `ipe test` / `ipe dev watch`).
# With it on, an absent `ENV` / `IPE_ENV` reads as development and the operator
# console may default open, on a loopback bind only. NOT in `full` and implied by
# nothing: a binary built without it resolves every absent posture to
# production, so a release artifact keeps the console closed until
# `IPE_CONSOLE_AUTH` names a credential mode.
dev-posture = []
# Browser-WASM TEA sink (`src/wasm/`): mount + patch-apply + delegated events.
# Compiles only on wasm32 (the module is target-cfg'd); NOT in `full` — native
# builds never link the wasm glue.
wasm-client = [
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_error_panic_hook",
    "dep:gloo-timers",
    # The static wasm module set declares `json`, the floor serde derives, and
    # `dom/form.rs` unconditionally, so `wasm-client` implies `json` (which pulls
    # `serde`) and `serde_urlencoded` (the browser form-decode sink). The closed
    # WASM app template (`WASM_CARGO_TOML`) declares `serde`/`serde_json`/
    # `serde_urlencoded` non-optional regardless, so the emitted-app dep graph is
    # unchanged.
    "json",
    "serde",
    "dep:serde_urlencoded",
    # The browser sink renders through the same server-free render core (the
    # `crate::dom` diff/dispatch/form pipeline + `style_inject`), so it selects
    # `web-core` to satisfy the render-core `#[cfg(feature = "web-core")]` gates.
    "web-core",
    # The static wasm module set (`WASM_RUNTIME_MOD_RS`) declares `crypto_core`
    # and `secret` unconditionally, so `wasm-client` implies both features to
    # satisfy the source `#[cfg]` gates and pull `sha2`/`hmac`/`subtle`
    # (the wasm32 hash family) and `zeroize`. `secret` implies
    # `crypto-core`; naming both is explicit, not redundant selection.
    "crypto-core",
    "secret",
    # `url`: the wasm32 `http_client.rs` fetch arm parses/narrows URLs via
    # `crate::url` (now behind the `url` feature).
    "url",
    # `encoding`: the static wasm module set keeps `encoding.rs` / `bytes.rs`
    # behind the `encoding` feature.
    "encoding",
    # The static wasm module set (`WASM_RUNTIME_MOD_RS`) declares `regex_kernel`,
    # `uuid_kernel`, and `random` unconditionally, so `wasm-client` implies their
    # features to satisfy the source `#[cfg]` gates. (`getrandom` is non-optional,
    # so `random` — which is empty — pulls no dep here.)
    "regex",
    "uuid",
    "random",
    # The static wasm module set also declares `log` and `time` unconditionally.
    # Their wasm arms read `js_sys::Date` / `gloo-timers`, not `chrono`, but the
    # module declarations are now feature-gated, so `wasm-client` implies both to
    # satisfy the source `#[cfg]`. `log`/`time` pull `dep:chrono` via `time-core`;
    # the closed WASM app template (`WASM_CARGO_TOML`) declares `chrono`
    # non-optional regardless, so this changes no emitted-app dep graph.
    "log",
    "time",
    # The static wasm module set declares `char_category`, `decimal`, and `money`
    # unconditionally, so `wasm-client` implies `decimal` + `char-category` to
    # satisfy their source `#[cfg]` gates. The closed WASM app template
    # (`WASM_CARGO_TOML`) declares `rust_decimal` / `unicode-general-category`
    # non-optional regardless, so this changes no emitted-app dep graph.
    "decimal",
    "char-category",
]

[dev-dependencies]
# Existence-proven test-artifact resolvers.
e2e-support = { path = "../../../tools/e2e-support" }
regex = "1"
serde_json = "1"
sha2 = "0.10"
# `tests/no_ungated_dial.rs` parses the dial-site sources into a syntax tree, so
# `#[cfg(test)]`, comments, and strings are classified by the parser rather
# than by a text scanner.
syn = { version = "3", features = ["full", "visit"] }
proc-macro2 = "1"

# `wasm-bindgen-test` drives the headless-browser test harness (`tests/
# wasm_*` files, `#[wasm_bindgen_test]`) — meaningless on native, so it is
# wasm32-only (see the `[target.'cfg(target_arch = "wasm32")'.dev-dependencies]`
# table below), never pulled into a native `cargo test`.
#
# `proptest`/`bcrypt`/`jsonwebtoken`/`aes-gcm`/`chacha20poly1305`/`pbkdf2` are
# native-only test deps (property tests over pure kernels; AEAD/RSA/PBKDF2/
# bcrypt hashing kernels, none of which have a wasm32 denotation — see
# `ipe_kernels::StdlibKernel::wasm_client_available`'s doc comment: "Every
# OTHER Crypto kernel... stays denied"). Root-caused getrandom conflict: an
# unconditional dev-dependency here is compiled for EVERY target `cargo
# test`/`cargo check --tests` targets, including wasm32 — `bcrypt 0.17` and
# `proptest`'s `rand 0.9` chain both pull `getrandom 0.3` (`rand_core 0.9`),
# which collides with the pinned `getrandom 0.2` (`features = ["js"]`) this
# crate's own `[dependencies]` uses for the wasm entropy shim (`uuid`/
# `crypto_random_bytes`/`random.rs`'s `lcg_init`). getrandom 0.2 and 0.3 are
# NOT the same crate to cargo (SemVer-major difference) so cargo happily
# resolves both into one dependency graph — but `getrandom 0.3` refuses to
# build on `wasm32-unknown-unknown` at all without an explicit
# `--cfg getrandom_backend="wasm_js"` RUSTFLAG this crate never sets (it
# targets 0.2's `js` feature instead), so the wasm32 test target fails to
# compile the moment either of these deps enters its graph. Moving them into
# a native-only `[target]` table (Cargo's standard target-conditional
# dev-dependency mechanism) keeps a wasm32 test build's dependency closure
# free of `getrandom 0.3` entirely — the actual fix, not a version pin
# override (which would just re-litigate the SAME collision against whatever
# version bcrypt/proptest ship next).
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# `symbol_resolution` reads the emit-symbol SSOT (`StdlibKernel::def().runtime_fn`)
# to check every kernel's runtime function exists — a native-only source-walk test.
ipe_kernels = { path = "../../compiler/kernels" }
# `scrub_log_controls_tests` asserts the runtime log-hazard table equals the
# compiler's terminal set (`ipe_diagnostics::terminal::DENIED_FORMAT_CHARS`).
ipe_diagnostics = { path = "../../compiler/diagnostics" }
# `rerun_this_test_exact`: the shared re-exec that proves the child ran its test.
e2e-support = { path = "../../../tools/e2e-support" }
proptest = "1"
jsonwebtoken = "9"
bcrypt = "0.17"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
pbkdf2 = "0.12"
# `tower` moved to an optional `[dependencies]` gated by the `server` feature
# (it now backs the front-door concurrency-cap layer, not only the test-only
# `ServiceExt::oneshot`). The `server` unit tests reach it through that feature.
tokio = { version = "1", features = ["full", "test-util", "macros"] }
# A fake TLS PostgreSQL server proves the pinned relay keeps SNI and
# certificate host-name verification.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# `pipe`: the echo-guard tests build a non-tty fd pair.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["pipe"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[lints.rust]
# Mirrors the workspace `unsafe_code` deny (this crate keeps its own `[lints]`).
unsafe_code = "deny"

[lints.clippy]
# No-runtime-errors gate: a panic vector reached from well-typed code is a bug.
# Exceptions are per-site #[allow] markers carrying IPE-RUST-AUDIT:ACCEPTED,
# inventoried by tools/panic-scan.
unwrap_used = "deny"
expect_used = "deny"
# Mirrors the workspace `mem_forget` deny: a forgotten `Drop` guard leaks.
mem_forget = "deny"
