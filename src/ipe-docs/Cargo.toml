[package]
name = "ipe_docs"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "gen-capabilities-docs"
path = "src/bin/gen_capabilities_docs.rs"

[[bin]]
name = "gen-env-docs"
path = "src/bin/gen_env_docs.rs"

[[bin]]
name = "gen-stdlib-docs"
path = "src/bin/gen_stdlib_docs.rs"

[[bin]]
name = "gen-requirements-docs"
path = "src/bin/gen_requirements_docs.rs"

[[bin]]
name = "gen_site"
path = "src/bin/gen_site.rs"

[dependencies]
ipe_annotate    = { path = "../compiler/annotate" }
ipe_diagnostics = { path = "../compiler/diagnostics" }
ipe_intern      = { path = "../compiler/intern" }
ipe_kernels   = { path = "../compiler/kernels" }
ipe_syntax    = { path = "../compiler/syntax" }
ipe_parse     = { path = "../compiler/parse" }
ipe_stdlib    = { path = "../stdlib" }
# The runtime's operator env registry, projected into the env reference.
ipe-runtime-rust = { path = "../runtime/rust", default-features = false }

[lints]
workspace = true
