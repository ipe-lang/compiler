[package]
name = "ipe"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "ipe"
path = "src/lib.rs"

[[bin]]
name = "ipe"
path = "src/main.rs"

# Generator for docs/reference/cli.md — renders the CLI surface from the
# `help::COMMANDS` SSOT. A CI drift gate (regen +
# `tools/scripts/generated-unchanged.sh`) keeps the committed reference
# honest, mirroring gen-stdlib-docs / gen-env-docs.
[[bin]]
name = "gen-cli-docs"
path = "src/bin/gen_cli_docs.rs"

[features]
# Publisher-identity provenance over the index-pinned `sha256` (keyless
# Sigstore: Fulcio-issued ephemeral cert + Rekor inclusion proof). The typed
# bundle model, the deny-by-default `TrustPolicy`, and the verification SEAM
# (`SignatureVerifier`) are always compiled and tested against a mock verifier,
# so the trust-decision logic is exercised by the default gate. Only the
# concrete `sigstore`-crate verifier — which pulls a heavy async/TLS transitive
# graph (tokio, rustls, the TUF client) — sits behind this feature, off by
# default so an ordinary `ipe` build stays lean.
signing = ["dep:sigstore", "dep:sigstore_protobuf_specs", "dep:pki_types"]

# `ipe run --target wasi` executes the emitted `wasm32-wasip1` module in an
# EMBEDDED wasmtime engine (never an external `wasmtime` binary), so the WASI
# context is built by us from the program's declared capability floor — the
# SAME deny-by-default model as the native run jail. wasmtime is a large
# dependency (a full wasm engine + the preview1 WASI shim), so it sits behind
# this feature, OFF by default so an ordinary dev/test `ipe` build stays lean
# and ON for release packaging. With the feature off `ipe run --target wasi`
# returns a typed refusal naming the feature — never a panic, never a silent
# fallback.
wasi_run = ["dep:wasmtime", "dep:wasmtime-wasi"]

[dependencies]
ipe_stdlib = { path = "../stdlib" }
ipe_docs = { path = "../ipe-docs" }
ipe_fmt = { path = "../ipe-fmt" }
ipe_kernels = { path = "../compiler/kernels" }
ipe_intern = { path = "../compiler/intern" }
ipe_diagnostics = { path = "../compiler/diagnostics" }
ipe_parse = { path = "../compiler/parse" }
ipe_syntax = { path = "../compiler/syntax" }
ipe_db = { path = "../compiler/db" }
ipe_canon = { path = "../compiler/canon" }
ipe_types = { path = "../compiler/types" }
ipe_lower = { path = "../compiler/lower" }
ipe_lint = { path = "../compiler/lint" }
ipe_ir = { path = "../compiler/ir" }
ipe_backend = { path = "../compiler/backend" }
ipe_backend_rust = { path = "../compiler/backend/rust" }
ipe_ffi = { path = "../compiler/ffi" }
ipe_sandbox = { path = "../compiler/sandbox" }
ipe_env = { path = "../compiler/env" }
ipe_fs_open = { path = "../compiler/fs_open" }
ipe_lsp_server = { path = "../lsp/server" }
# Phase 7 (`crate::watch` — Tasks 21-25): the confined watcher + process
# supervisor primitives, and the two crates `watch.rs` drives directly —
# `salsa` for `Cancelled::catch`/`Setter` (Task 25's cancellation) and
# `notify` for the raw filesystem watch (Task 21). Same salsa pin as
# `ipe_db` (`crates/ipe_db/Cargo.toml`) — one version across the workspace.
ipe_watch = { path = "../compiler/watch" }
# The `CustomElement.node` custom-element glue generator, as a build-time library: the
# static/wasm bundler drives the SAME `widget_assets` glue the server runtime
# serves (one glue, no drift) over the widget manifest. Only the lean
# `widget-assets` feature (sha2 + base64 + the shared wire constants) — NOT the
# heavy `web`/server surface, and never linked into an emitted program.
# `control-wire`: the dev-loop control-channel CODEC (`ControlFrame` +
# `encode_frame`/`decode_frame`), so `ipe watch`'s `send_control_frame` builds
# and parses frames from the ONE wire definition (SSOT) over its own std sockets
# — no tokio server pulled into the CLI.
ipe-runtime-rust = { path = "../runtime/rust", default-features = false, features = ["widget-assets", "control-wire"] }
salsa = "=0.28.5"
notify = "8"
# On-disk build cache (`src/cache.rs`) — content hashing of the whole-project
# key + the compiler/toolchain version-epoch, and JSON (de)serialization of the
# cached `EmittedProject`.
sha2 = "0.10"
hex = "0.4"
# `crate::watch::mint_hot_token` fills the hot-control token from the OS CSPRNG.
# `getrandom` is a thin cross-platform wrapper over each target's real CSPRNG
# (`getrandom(2)`/`/dev/urandom` on Unix, `BCryptGenRandom` on Windows), so the
# security control has no silent non-CSPRNG fallback on any released target.
getrandom = { version = "0.3", features = ["std"] }
# `ipe login`'s opt-in signing-key setup (`src/ssh_signing_key.rs`) generates an
# ed25519 keypair in process — no `ssh-keygen` subprocess, so no argv or PATH
# exposure — and encodes it in the OpenSSH format. `ed25519-dalek` (already in the
# vetted graph) derives the public key from the CSPRNG seed; `base64` armors the
# key files; `zeroize` wipes the seed and the encoded private key from memory.
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
base64 = "0.22"
zeroize = "1"
serde_json = "1"
# `[dependencies]` version requirements in `ipe.toml` are parsed into typed
# `semver::VersionReq` at manifest-parse time (parse, don't validate).
semver = "1"
# `ipe upgrade` / `ipe health` fetch the latest published release tag over HTTPS
# (`src/net.rs`). A small blocking, pure-Rust client with the same rustls TLS
# backend the runtime already uses — no `curl` subprocess, and no async runtime
# pulled into the CLI for a single one-shot GET.
ureq = { version = "2", default-features = false, features = ["tls"] }
# The Tier-2 wrapper capability gate reads a wrapper crate's `Cargo.toml`
# dependency tables STRUCTURALLY (parse, don't validate): a hand-rolled line
# scan under-refuses on valid-but-unusual TOML (a trailing comment on a header,
# whitespace inside `[ dependencies ]`, an inline `dependencies = { … }`
# table), and any missed dependency would admit an unconstrained capability.
# Same `toml` version the runtime crate already pins, so this adds no new crate
# to the vetted dependency graph.
toml = "0.8"
# `ipe health`'s config-edit fixes rewrite a user's `~/.cargo/config.toml` and
# `<IPE_HOME>/config.toml`. A structural edit that dropped their comments and
# formatting would be a hostile surprise on a file the user owns, so the edit
# goes through the format-preserving `toml_edit` document model: only the exact
# key it sets is touched, every comment and layout the user wrote is kept.
toml_edit = "0.25"
# The runtime crate SOURCE (`../runtime/rust`: its `Cargo.toml` + `src/**`) is
# compiled INTO this binary as a static directory tree, so a copied `ipe`
# binary carries its own runtime source and never needs a separate download.
# `include_dir` walks the tree at build time and embeds each file as a byte
# slice — source only, no object code (the rejected prebuilt-rlib route). The
# tree is written to `<IPE_HOME>/runtime/<version>/rust` on demand and built
# locally.
include_dir = "0.7"
# The `ipe package audit` provenance panic-scan reuses the SAME token scanner the
# repo's abrupt-failure attestation hook runs (`tools/panic-scan`), so the gate
# and the hook can never diverge on what counts as an authored abrupt-failure
# construct.
panic-scan = { path = "../../tools/panic-scan" }
# Keyless publisher-identity provenance (`crate::signing`), behind the optional
# `signing` feature. Offline bundle verification with an (issuer, SAN) identity
# allowlist: `bundle::verify::blocking::Verifier` + `ManualTrustRoot` +
# `policy::Identity`. The `sigstore-trust-root` feature (the TUF client that
# fetches the public-good root at runtime) is DELIBERATELY OFF — the offline
# path builds the trust root from vendored root material via `ManualTrustRoot`,
# so verification makes no network call and the heavy `tough`/`aws-lc-rs`/TUF
# graph is never linked. `rustls-tls` matches the CLI's existing TLS backend.
# Optional so the default build never links the async graph this crate carries.
sigstore = { version = "0.14", default-features = false, features = ["verify", "rustls-tls"], optional = true }

# The Sigstore trusted-root schema (`TrustedRoot` protobuf-JSON: Fulcio CA cert
# chains + Rekor / CT-log public keys). Parsed offline from the vendored
# `signing/trusted_root.json` into a `ManualTrustRoot` — the same material the
# TUF client would fetch — so no `sigstore-trust-root`/`tough` graph is linked.
# The exact version `sigstore`'s `verify` feature already resolves, named
# directly so the offline root parse can build on the crate's own types rather
# than a duplicated hand-rolled schema. Gated behind `signing` alongside it.
sigstore_protobuf_specs = { version = "0.5", default-features = false, optional = true }

# `ManualTrustRoot::fulcio_certs` is `Vec<CertificateDer>` from this crate (the
# `pki_types` the sigstore graph already links). Named directly, `signing`-gated,
# so the offline trust-root parse can build owned `CertificateDer` values from
# the DER bytes in `trusted_root.json`.
pki_types = { package = "rustls-pki-types", version = "1", optional = true }

# The embedded wasm engine + the WASI preview1 shim for `ipe run --target wasi`,
# behind the optional `wasi_run` feature. `wasmtime` runs the emitted
# `wasm32-wasip1` module in-process; `wasmtime-wasi`'s `p1` module supplies the
# preview1 `WasiCtxBuilder` we drive from the declared capability floor
# (preopened dirs, env allowlist, args) with NO ambient authority. The Cranelift
# JIT default backend is kept (the module is executed once per `ipe run`, not a
# cold-start-sensitive path). Optional so the default build never links the
# engine's graph.
wasmtime = { version = "35", default-features = false, features = ["cranelift", "runtime", "std"], optional = true }
wasmtime-wasi = { version = "35", default-features = false, features = ["preview1"], optional = true }

# `ipe health`'s free-disk check reads the filesystem's available blocks via
# `statvfs(2)`. rustix exposes the syscall directly — no libc binding in our own
# code and no `df` subprocess — and it is already in the dependency graph, so the
# check adds no new vetted crate. Unix-only: the query has no portable analogue
# on the non-Unix targets this CLI builds for.
[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", features = ["fs", "process", "termios"] }
# A remote transfer's child runs in its own process group so a refusal can kill
# every process it spawned; the group is then outside the terminal's reach, so
# the interrupt, quit, hangup and stop keys are relayed to it through
# signal-hook's safe handler registry (already vetted and in the graph).
signal-hook = "0.3"

# Held output-directory handles create and remove entries relative to a held
# directory handle (`NtCreateFile` with a root directory) through
# cap-primitives, so the Windows side acts through handles with no `unsafe` of
# our own; opening and identifying a held level lives in `ipe_fs_open`.
[target.'cfg(windows)'.dependencies]
cap-primitives = "3.4.6"

[dev-dependencies]
ipe-test-temp = { path = "../../tools/test-temp" }
# Build + run plumbing shared by the golden E2E tests (tests/support/mod.rs).
# `cargo build --message-format=json` parsing that locates the produced binary
# lives in the `e2e_support` crate, so serde_json is pulled in transitively.
e2e-support = { path = "../../tools/e2e-support" }
# The by-path catalog reader the FFI negative tests load their own caches with.
ipe_ffi = { path = "../compiler/ffi", features = ["testing"] }
# Source scans that read this crate's own syntax tree (comments and literals
# never match). The same versions and features `panic-scan` already builds into
# this crate's graph, so no new package compiles.
proc-macro2 = "1"
syn = { version = "3", default-features = false, features = ["full", "visit", "parsing"] }

[lints]
workspace = true
