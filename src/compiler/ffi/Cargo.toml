[package]
name = "ipe_ffi"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Shim-free Rust-crate FFI binding generator: typed decode of inspector output, call-AST validation, and artifact emission"

[dependencies]
ipe_diagnostics = { path = "../diagnostics" }
ipe_canon = { path = "../canon" }
ipe_intern = { path = "../intern" }
ipe_kernels = { path = "../kernels" }
# Keyword table + identifier charset: the lexer is the single source of truth
# for which names the generated interface module may bind.
ipe_parse = { path = "../parse" }
# The asserted-call surface (`Rust.Ffi.call`) parses the author's annotation
# straight from the source AST — never from re-rendered text.
ipe_syntax = { path = "../syntax" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The Tier-2 wrapper capability scan lexes wrapper Rust with the SAME
# proc-macro2 token model `tools/panic-scan` uses, so a capability-bearing path
# named inside a string literal or a comment is invisible and one split across
# lines is still found. `span-locations` supplies the 1-based line a diagnostic
# points at.
proc-macro2 = { version = "1", features = ["span-locations"] }
# A wrapper crate's `Cargo.toml` is parsed STRUCTURALLY at the root jail, so the
# `[dependencies]` key the emitted manifest binds is proven equal to the Cargo
# package name before cargo ever sees it. Same `toml` version the CLI and the
# runtime already pin, so no new crate enters the vetted dependency graph.
toml = "0.8"
# The wrapper manifest is opened relative to its held directory, never through
# a link, never blocking, and read under a typed byte cap.
ipe_fs_open = { path = "../fs_open" }

[dev-dependencies]
ipe-test-temp = { path = "../../../tools/test-temp" }
ipe_env = { path = "../env" }
# The e2e tier gate and existence-proven test-artifact resolvers.
e2e-support = { path = "../../../tools/e2e-support" }

[features]
# The by-path, link-following catalog reader (`driver::load_catalog`) for
# tests that load a cache they created themselves. Production never enables it.
testing = []

[lints]
workspace = true
