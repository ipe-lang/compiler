[package]
name = "ipe_types"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ipe_intern = { path = "../intern" }
ipe_diagnostics = { path = "../diagnostics" }
ipe_env = { path = "../env" }
ipe_canon = { path = "../canon" }
# Leaf crate (deps: ipe_intern + ipe_diagnostics only) → clean down-edge, no
# cycle. Needed to name `StdlibKernel` in the parse-once kernel-scheme registry
# (`stdlib_scheme`) that the `VarKernel { id }` constrain arm delegates to.
ipe_kernels = { path = "../kernels" }
# `EnumCount` for `StdlibKernel::COUNT`, sizing the per-kernel scheme memo.
strum = { version = "0.26" }

[dev-dependencies]
ipe_parse = { path = "../parse" }
# `SHOWN_LEAVES`: the show gate is pinned against the compiler's show table.
ipe_ir = { path = "../ir" }

[lints]
workspace = true
