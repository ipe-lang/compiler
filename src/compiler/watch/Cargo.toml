[package]
name = "ipe_watch"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Task 21 (confined watcher). Directory-level (not inode-level) watching —
# editors save via tmp-write + rename, so an inode watch misses the new file.
notify = "8"
# Task 23's `LastGoodBinary` content hash. Same pin as `ipec`'s own build
# cache (`crates/ipec/Cargo.toml`) — one version across the workspace.
sha2 = "0.10"

[dev-dependencies]
ipe-test-temp = { path = "../../../tools/test-temp" }

[lints]
workspace = true
