[package]
name = "ipe_backend_rust"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ipe_ir = { path = "../../ir" }
# Direct edge (already transitive via ipe_ir) so the emit-symbol drift tripwire
# in naming.rs can read StdlibKernel::ALL and KernelDef.runtime_fn.
ipe_kernels = { path = "../../kernels" }
ipe_intern = { path = "../../intern" }
ipe_backend = { path = ".." }
ipe_diagnostics = { path = "../../diagnostics" }
# Model schema tag (H24) — same pin as ipe_watch/ipec/runtime.
sha2 = "0.10"
# The exact float-to-shortest-decimal formatter `serde_json` uses internally
# (its `write_f64` calls `ryu::Buffer::format_finite`). Using it directly makes a
# baked `Float` template default byte-identical to the runtime's
# `#[derive(Serialize)]` form — single source of truth for the float spelling.
ryu = "1"

[dev-dependencies]
ipe-test-temp = { path = "../../../../tools/test-temp" }
ipe_env = { path = "../../env" }
# The const-fold conformance test calls the REAL runtime string builders
# (`string_from_int` / `string_from_float` / `string_join`) directly and asserts
# they are byte-identical to `const_fold`'s reproductions — the dev == prod
# guarantee. The transition conformance test additionally decodes a
# `CompileTransition::to_json` datum into the runtime `web::transition::Transition`
# and runs the compiled `apply_transition`, so the `web` feature is enabled.
ipe-runtime-rust = { path = "../../../runtime/rust", features = ["web"] }
# The transition conformance test decodes the emitted datum JSON into the
# runtime `Transition` to prove the compile-time serializer and the runtime
# codec agree byte-for-byte, and derives serde on a small fixture Model.
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# Shared target resolution for SEAL e2e tests: `child_shared_target_from_env`
# translates `IPE_ORACLE_SHARED_TARGET` → child `CARGO_TARGET_DIR` so the emitted
# crate links against the warm shared dependency tree rather than cold-building.
e2e-support = { path = "../../../../tools/e2e-support" }
# The literal-owner ratchet (`tests/rust_literal_owner_scan.rs`) lexes every
# backend source file and reads string-literal values through syn.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", default-features = false, features = ["full", "visit", "parsing"] }

[lints]
workspace = true
