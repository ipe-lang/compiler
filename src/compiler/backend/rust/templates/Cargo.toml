[package]
name = "ipe-app"
version = "0.1.0"
edition = "2024"

[features]
# The default feature list below is a load-bearing ANCHOR mutated in place by the
# manifest augmenters (`async_runtime_cargo_toml` restores `"tokio"`, the
# server/db/… steps insert their feature, the static path splices the allocator)
# — it must stay byte-exact, and every augmenter finds it as the line-initial
# occurrence, so no comment here may open a bracketed list. The vendored fallback
# keeps `encoding` ON via `json` implying it (json is always defaulted here), so
# the vendored `encoding.rs` / `bytes.rs` `#[cfg]` gates stay satisfied without
# perturbing the anchor. The `base64` / `hex` / `percent-encoding` deps below
# stay non-optional in the vendored escape hatch.
default = ["json"]
tokio = []
crypto = []
json = ["encoding", "serde"]
db = []
encoding = []
# Declared but inert in the vendored escape hatch: `zeroize` / `subtle` / `rsa`
# stay non-optional below. The `#[cfg(feature = "secret")]` gates in the vendored
# runtime source (`app_config.rs::resolve_db_url_override`, `secret.rs`) need
# this entry to compile — without it rustc emits E0425 for the gated functions.
secret = []
# The dev-loop build intent. `dev_posture_cargo_toml` promotes it into `default`
# for an `ipe dev build` / `ipe dev run` / `ipe test` / `ipe dev watch` emit; a release emit
# leaves it off, so the vendored console default stays closed.
dev-posture = []
# Declared but inert in the vendored escape hatch: `serde` / `serde_json` /
# `serde_urlencoded` stay non-optional below. The floor serde derives
# (`IpeMaybe`/`IpeResult`/`IpeError`/`Decimal`/`Patch`) and the `dom/form`
# decode are `#[cfg(feature = "serde")]` in the vendored source, so this entry
# keeps rustc's check-cfg quiet AND enables those derives. `json` implies it (the
# floor `default = ["json"]` keeps serde on), mirroring the runtime crate.
serde = []
# Declared but inert in the vendored escape hatch: `regex` / `uuid` deps stay
# non-optional below, and the emitted `ipe_runtime/mod.rs` declares
# `regex_kernel` / `uuid_kernel` / `random` by inclusion, not by `#[cfg]`. These
# entries only keep rustc's check-cfg quiet.
regex = []
uuid = []
random = []
# The server-free render core (the `crate::dom` diff/dispatch/form pipeline +
# `style_inject`/`page_shell`). Declared but inert in the vendored escape hatch:
# its deps (`serde` / `serde_json` / `serde_urlencoded`) stay non-optional below.
# The render-core `#[cfg(feature = "web-core")]` gates in the vendored source
# (`dom/form.rs`, `html.rs`'s `html_on_raw_*`/`is_void`, `css_safety.rs`'s style
# sinks, `web_page_core.rs`) need this entry to compile — every render host (web /
# wasm-client / webview) promotes it. `web` implies it, mirroring the runtime crate.
web-core = []
# `web` implies `widget-assets`, mirroring the runtime crate: the vendored
# `web/mod.rs` serves the SRI-pinned port glue (`port_glue_script`, the glue
# route) under `#[cfg(feature = "widget-assets")]`, and the trimmed
# `ipe_runtime/mod.rs` declares `widget_assets` / `js_port_glue` for every web
# program. Inert otherwise: its deps stay non-optional below.
widget-assets = []
web = ["web-core", "widget-assets"]
redis_store = []
# `webview = []` is a surgery anchor: `webview_cargo_toml` replaces it with the
# wry+tao deps AND promotes `web-core` + `webview` into `default` — so a webview
# build activates the render core without a static feature edge here.
webview = []
tui = []
websocket_client = []
# The outbound HTTP client. `http_client_cargo_toml` promotes it and adds
# `reqwest` for a program that reaches the `http_client` runtime module; the
# vendored `web/mod.rs` compiles the telemetry exporters and the console proxy
# (and `system::exit_process` flushes the exporters) only with it on.
http_client = []
# Promoted by `email_cargo_toml` for an `Ipe.Email` program, mirroring the
# runtime crate; the vendored `ssrf.rs` dial helpers it reaches are gated on it.
email = []
# Promoted by `config_cargo_toml` for a program that reaches the
# `config_decode` runtime module, mirroring the runtime crate.
config = []
# Declared but never promoted: the vendored source tree carries no `debugger`
# module, so the driver and the emitter both refuse a `--debugger` build under
# the vendored emit model. Declaring them keeps the gates in the vendored source
# naming only features this manifest knows, so each evaluates off by
# declaration rather than by an unknown name.
debugger = []
control-wire = []
# Declared but never promoted: the vendored emit picks the database driver by
# which `config.rs` it writes, not by a feature. The runtime `config.rs` that a
# sqlite emit vendors verbatim names both in its two-drivers guard, which
# therefore stays off by declaration.
db-sqlite = []
db-postgres = []
# Declared but inert in the vendored escape hatch: `chrono` stays non-optional
# below and the template `ipe_runtime/mod.rs` declares `log` / `time` by
# inclusion, not by `#[cfg]`. These entries only keep rustc's check-cfg quiet for
# the `#[cfg(feature = "log")]` / `#[cfg(feature = "time-core")]` gates the
# vendored runtime source carries.
log = []
time-core = []
# Declared but inert in the vendored escape hatch: `rust_decimal` /
# `unicode-general-category` stay non-optional below and the template
# `ipe_runtime/mod.rs` declares `decimal` / `money` / `char_category` by
# inclusion, not by `#[cfg]`. These entries only keep rustc's check-cfg quiet for
# the `#[cfg(feature = "decimal")]` / `#[cfg(feature = "char-category")]` gates
# the vendored runtime source carries.
decimal = []
char-category = []
# Gates the IANA-zone calendar surface of the always-declared `time` runtime
# module (the `chrono-tz`-backed helpers). Promoted into `default` and paired
# with the `chrono-tz` dependency only for a program that reaches an `Ipe.Time`
# kernel; a program that uses no Time kernel keeps it off and drops the crate.
time = []
# Declared but inert on native targets: the vendored runtime gates its browser
# sink on `cfg(all(target_arch = "wasm32", feature = "wasm-client"))`. Declaring
# the feature keeps rustc's check-cfg quiet without pulling any wasm glue (only
# a wasm32 build ever activates it, via the WASM manifest template).
wasm-client = []
alloc_dlmalloc = ["dep:dlmalloc"]
alloc_mimalloc = ["dep:mimalloc"]

[dependencies]
dlmalloc = { version = "0.2", features = ["global"], optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
regex = "1"
unicode-general-category = "1"
base64 = "0.22"
hex = "0.4"
percent-encoding = "2"
chrono = "=0.4.45"
rust_decimal = { version = "1", features = ["serde"] }
hmac = "0.12"
subtle = "2"
zeroize = "1"
getrandom = "0.2"
uuid = { version = "1", features = ["v4", "v7"] }
bcrypt = "0.17"

# Unix-only: the vendored runtime reaches unix syscalls through rustix's safe
# wrappers — `Io.readSecret` terminal echo (termios), `Process.runInPty`
# (pty + termios), the child parent-death floor (process), the child descriptor
# floor (fs + process), and `scratch_core`'s `O_NOFOLLOW` open plus its
# entry-owner facts (fs + process).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["pty", "termios", "fs", "process", "std"] }

[profile.dev]
debug = 0
incremental = true
overflow-checks = false

[profile.release]
strip = true

# Detach this generated crate from any ancestor cargo workspace so it builds
# hermetically even when emitted inside another workspace tree.
[workspace]
