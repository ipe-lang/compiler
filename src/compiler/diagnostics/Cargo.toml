[package]
name = "ipe_diagnostics"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ipe_path_core = { path = "../path-core" }
ipe_env = { path = "../env" }
unicode-width = "0.1"

[dev-dependencies]
# The Unicode general-category data the format-character deny table is checked against.
unicode-general-category = "1"
# Decodes the JSON display escaper's output back to its input.
serde_json = "1"
# Resolves the crate's manifest directory, failing loudly when it is absent.
e2e-support = { path = "../../../tools/e2e-support" }

[lints]
workspace = true
