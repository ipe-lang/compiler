[package]
name = "ipe_kernels"
edition.workspace = true
version.workspace = true
license.workspace = true

# ── DAG constraint ──────────────────────────────────────────────────────────
# `ipe_kernels` is a LEAF crate.  Only `ipe_intern` and `ipe_diagnostics` are
# permitted as in-workspace dependencies.  NO dependency on `ipe_ir`,
# `ipe_types`, or `ipe_backend_rust` is ever allowed — those crates import
# `ipe_kernels`, and a reverse edge would create a cycle. `serde` is an
# external leaf dependency (no in-workspace edge), added so `StdlibKernel`
# can derive `Serialize`/`Deserialize` for the Phase 6.5 on-disk lowered-IR
# cache (`ipe_ir::Callee::Kernel` embeds a `StdlibKernel`).
#
# `strum` is likewise an external leaf dependency (no in-workspace edge). Its
# `EnumCount` derive gives `StdlibKernel` a compiler-maintained variant count
# that the `ALL`-completeness guard checks against, and its `EnumIter` derive
# lets `FieldTag::all` enumerate every tag — so no census is hand-listed.
[dependencies]
serde = { version = "1", features = ["derive"] }
strum = { version = "0.26", features = ["derive"] }

# `ipe_parse` and `ipe_syntax` are used only in the SSOT test
# (`tests/maybe_veneer_ssot.rs`) that parses `Maybe.ipe` and asserts the
# written type annotations equal the kernel scheme shapes. Both crates sit
# BELOW `ipe_kernels` in the DAG (they have no dependency on `ipe_kernels`),
# so adding them here introduces no cycle.
[dev-dependencies]
# Existence-proven test-artifact resolvers.
e2e-support = { path = "../../../tools/e2e-support" }
ipe_intern = { path = "../intern" }
ipe_parse = { path = "../parse" }
ipe_syntax = { path = "../syntax" }

[lints]
workspace = true
