[package]
name = "ipe_lsp_server"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ipe_db = { path = "../../compiler/db" }
ipe_diagnostics = { path = "../../compiler/diagnostics" }
ipe_lsp_features = { path = "../features" }
ipe_docs = { path = "../../ipe-docs" }
ipe_lint = { path = "../../compiler/lint" }
lsp-server = "0.7"
lsp-types = "0.95"
serde = "1"
serde_json = "1"
crossbeam-channel = "0.5"
# Same salsa pin as `ipe_db` — one version across the workspace; needed for
# `Cancelled::catch` around worker-thread query demands.
salsa = "=0.28.5"

[dev-dependencies]
e2e-support = { path = "../../../tools/e2e-support" }
ipe-test-temp = { path = "../../../tools/test-temp" }
ipe_stdlib = { path = "../../stdlib" }

[lints]
workspace = true
