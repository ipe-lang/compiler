# cargo-deny configuration — supply-chain gate (RustSec advisories + license
# compliance + dependency-source pinning). Read by `cargo deny check` in
# .github/workflows/security.yml. See docs/architecture/ci-and-hosting.md for
# how this fits the rest of the CI posture (fmt/clippy/test/miri/e2e in ci.yml).
#
# `runtime`'s Cargo.toml gates most third-party deps (rsa, sqlx, redis, ...)
# behind optional Cargo features (default = []) — CI's `test` job only builds
# the default feature set. Enabling `full` here (mirroring ci.yml's
# `runtime-full-features` job: `cargo nextest run -p ipe-runtime-rust
# --features full`) makes the supply-chain graph match what actually ships in
# a real deployment, not just the narrow default-feature slice — otherwise an
# advisory affecting an optional dep (e.g. the `rsa` entry below) silently
# drops out of the scanned graph. Deliberately NOT `all-features = true`:
# `webview` (wry/tao) is explicitly excluded from `full` (see runtime/
# Cargo.toml's `[features]` comment — "NOT in `full`; default/CI builds
# compile the cross-platform stub instead") because it pulls a large,
# platform-gated GTK3/WebKitGTK binding surface (MPL-2.0-licensed cssparser,
# multiple `unmaintained` gtk-rs advisories) that no CI job or generated
# project actually builds by default; scanning it here would be noise against
# a feature surface this repo doesn't ship.
[graph]
all-features = false
no-default-features = false
features = ["full"]

# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
# Every entry is "ignore now, replace later": an accepted exposure, revisited
# when its upstream fix or a replacement lands, never a permanent waiver.
ignore = [
    "RUSTSEC-2025-0141", # bincode unmaintained (transitive; no runtime exposure)
    # RUSTSEC-2023-0071 — rsa 0.9.x "Marvin Attack" (PKCS#1 v1.5 timing
    # sidechannel). No fixed upstream release exists (the advisory's own
    # Solution field says "no fixed upgrade available"); pulled in via
    # `runtime`'s optional `crypto` feature for Ipe.Core.Jwt RS256 sign/verify
    # (jsonwebtoken -> rsa) — see runtime/src/ipe_runtime/jwt.rs +
    # runtime/src/ipe_runtime/crypto.rs. Exposure is limited to SIGN (private
    # key) + VERIFY (public key); the Marvin attack targets the PKCS#1 v1.5
    # DECRYPTION oracle, which this codebase never exercises. Accepted +
    # tracked; revisit when `rsa` ships a fix or a vetted constant-time
    # RS256 alternative replaces it.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0235 — rkyv 0.7.46 OOB reads when deserializing archives
    # containing Rc/Arc. rkyv is an optional serialization backend of
    # rust_decimal (feature "rkyv"); it appears in the lockfile because cargo
    # v4 lockfiles record all optional packages of every dep in the graph, even
    # unactivated ones. No code in this repo activates rust_decimal's "rkyv"
    # feature, and no rkyv archive is ever deserialized — the OOB path is
    # unreachable. Fix would require rust_decimal >= 0.8 (a semver-breaking
    # jump); accepted until that line is available and rust_decimal updates.
    "RUSTSEC-2026-0235",
]

# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
# The full set of licenses actually present across the workspace's
# `--features full` dependency tree (verified via `cargo deny check licenses`
# against this Cargo.lock, 2026-07-12) — every entry below is load-bearing,
# not a speculative default. Notable non-obvious entries: ISC / "Apache-2.0
# AND ISC" (ring, rustls-webpki, untrusted, simple_asn1 — the rustls/JWT TLS
# stack), CDLA-Permissive-2.0 (webpki-roots — Mozilla's CA root bundle
# license), 0BSD (quoted_printable, pulled in by lettre for MIME encoding).
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
# Advisory-only posture (warn, not deny) — a large workspace with many
# independent crate families (parser/types/backend/runtime/tools) legitimately
# pulls in duplicate transitive versions (e.g. two `syn` majors via different
# proc-macro crates); a hard `deny` here would be noise, not signal.
[bans]
# Ignore now, replace later: `arraydeque` 0.5 (a fixed-capacity ring buffer
# with internal `unsafe`, no advisory) is reached only through the YAML parser
# behind the optional `config` feature (serde-saphyr -> granit-parser), and
# every maintained pure-Rust YAML parser depends on it. It is accepted with NO
# advisory ignore, so a future RustSec entry against it turns this gate red;
# replace it once a YAML parser without it exists.
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"
# Roots come from `webpki-roots` 1.x only. A spec is `name:<semver req>`
# (`name@<version>` is an exact version, so `@<1` bans 1.x and `@<1.0.0`
# bans nothing). The OS root stores reach the tree only through the CLI's
# `reqwest` 0.13 chain, named by `wrappers`; the runtime's own closure is
# walked exactly in the `ipe` test `legacy_roots_are_refused_in_every_lock`.
deny = [
    { crate = "webpki-roots:<1", reason = "RUSTSEC-2026-0381: roots come from webpki-roots 1.x only" },
    { crate = "rustls-native-certs", wrappers = ["rustls-platform-verifier"], reason = "runtime roots are webpki-roots, never the OS store" },
    { crate = "rustls-platform-verifier", wrappers = ["reqwest"], reason = "runtime roots are webpki-roots, never the OS store" },
]

# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
# Every dependency MUST come from the official crates.io index — no ad-hoc git
# dependencies, no unvetted alternate registries. This is the actual
# supply-chain-attack gate: a compromised/typosquatted git source is a live
# vector cargo-audit's CVE-database check does not cover.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
