# cargo-deny configuration — supply-chain gate (RustSec advisories + license
# compliance + dependency-source pinning). Read by `cargo deny check` in
# .github/workflows/security.yml. See docs/architecture/ci-and-hosting.md for
# how this fits the rest of the CI posture (fmt/clippy/test/miri/e2e in ci.yml).
#
# The judged graph is the shipped feature surface: `full` (the runtime's
# optional deployment dependencies — rsa, sqlx, redis, ... — which the default
# feature set leaves out) plus the release build's feature set, so every crate a
# release binary links is judged. The release features are named once in
# .github/ci/release_build.py; verify-manifest.py check 28 refuses a graph that
# lacks them, and .github/ci/supply_chain_scope.py proves in security.yml that
# every registry crate the release build links is in the judged graph.
# Deliberately NOT `all-features = true`: `webview` (wry/tao) is excluded from
# `full` (see runtime/Cargo.toml's `[features]`) because it pulls a
# platform-gated GTK3/WebKitGTK binding surface no release or generated project
# builds by default.
[graph]
all-features = false
no-default-features = false
features = ["full", "wasi_run"]

# https://embarkstudios.github.io/cargo-deny/checks/advisories/cfg.html
[advisories]
# Every entry is "ignore now, replace later": an accepted exposure, revisited
# when its upstream fix or a replacement lands, never a permanent waiver. An
# entry the judged graph no longer encounters is an error in security.yml
# (`-D advisory-not-detected`, verify-manifest.py check 31), so a dropped
# exposure takes its ignore with it and a returning one is judged afresh.
ignore = [
    # RUSTSEC-2023-0071 — rsa 0.9.x "Marvin Attack" (PKCS#1 v1.5 timing
    # sidechannel). No fixed upstream release exists (the advisory's own
    # Solution field says "no fixed upgrade available"); pulled in via
    # `runtime`'s optional `crypto` feature for Ipe.Core.Jwt RS256 sign/verify
    # (jsonwebtoken -> rsa) — see runtime/src/ipe_runtime/jwt.rs +
    # runtime/src/ipe_runtime/crypto.rs. Exposure is limited to SIGN (private
    # key) + VERIFY (public key); the Marvin attack targets the PKCS#1 v1.5
    # DECRYPTION oracle, which this codebase never exercises. Accepted +
    # tracked; revisit when `rsa` ships a fix or a vetted constant-time
    # RS256 alternative replaces it.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0459 — bundled SQLite before 3.54.0 can return uninitialized
    # page-cache memory when a database is opened with a sibling `-wal` file of
    # a different page size. Reached through the runtime's `db` feature
    # (sqlx `sqlite-bundled` -> libsqlite3-sys 0.30.1). The fixed
    # libsqlite3-sys (>= 0.39) is out of reach: sqlx-sqlite 0.9.0 requires
    # `<0.38`. Exposure: a local party must plant both the database file and its
    # `-wal` where an Ipê program opens them. Accepted until sqlx publishes a
    # release that admits libsqlite3-sys >= 0.39; then upgrade and drop this line.
    "RUSTSEC-2026-0459",
    # RUSTSEC-2026-0543 — chrono unmaintained; the advisory's Solution field
    # says no safe upgrade is available. An unmaintained notice, not a known
    # vulnerability. chrono is the runtime's calendar and clock (Ipe.Time, Log,
    # Db, Web), and the emitted Cargo template pins it, so every program that
    # reaches those surfaces depends on it. Accepted until the runtime moves to
    # a maintained date/time crate behind the unchanged Ipe.Time API.
    "RUSTSEC-2026-0543",
]

# https://embarkstudios.github.io/cargo-deny/checks/licenses/cfg.html
# The full set of licenses actually present across the workspace's
# `--features full` dependency tree (verified via `cargo deny check licenses`
# against this Cargo.lock, 2026-07-12) — every entry below is load-bearing,
# not a speculative default. Notable non-obvious entries: ISC / "Apache-2.0
# AND ISC" (ring, rustls-webpki, untrusted, simple_asn1 — the rustls/JWT TLS
# stack), CDLA-Permissive-2.0 (webpki-roots — Mozilla's CA root bundle
# license), 0BSD (quoted_printable, pulled in by lettre for MIME encoding).
[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

# https://embarkstudios.github.io/cargo-deny/checks/bans/cfg.html
# Advisory-only posture (warn, not deny) — a large workspace with many
# independent crate families (parser/types/backend/runtime/tools) legitimately
# pulls in duplicate transitive versions (e.g. two `syn` majors via different
# proc-macro crates); a hard `deny` here would be noise, not signal.
[bans]
# Ignore now, replace later: `arraydeque` 0.5 (a fixed-capacity ring buffer
# with internal `unsafe`, no advisory) is reached only through the YAML parser
# behind the optional `config` feature (serde-saphyr -> granit-parser), and
# every maintained pure-Rust YAML parser depends on it. It is accepted with NO
# advisory ignore, so a future RustSec entry against it turns this gate red;
# replace it once a YAML parser without it exists.
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"
# Roots come from `webpki-roots` 1.x only. A spec is `name:<semver req>`
# (`name@<version>` is an exact version, so `@<1` bans 1.x and `@<1.0.0`
# bans nothing). The OS root stores are banned with no `wrappers`: the judged
# graph holds neither, so a crate that brings one in fails this gate until a
# reviewed exemption names it (an exemption the graph does not reach is an
# error in security.yml, verify-manifest.py check 31). The runtime's own
# closure is walked exactly in the `ipe` test
# `legacy_roots_are_refused_in_every_lock`.
deny = [
    { crate = "webpki-roots:<1", reason = "RUSTSEC-2026-0381: roots come from webpki-roots 1.x only" },
    { crate = "rustls-native-certs", reason = "runtime roots are webpki-roots, never the OS store" },
    { crate = "rustls-platform-verifier", reason = "runtime roots are webpki-roots, never the OS store" },
]

# https://embarkstudios.github.io/cargo-deny/checks/sources/cfg.html
# Every dependency MUST come from the official crates.io index — no ad-hoc git
# dependencies, no unvetted alternate registries. This is the actual
# supply-chain-attack gate: a compromised/typosquatted git source is a live
# vector cargo-audit's CVE-database check does not cover.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
