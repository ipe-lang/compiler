# rust-toolchain.toml
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
# Extra targets every toolchain install — local and CI — must carry:
#   - `wasm32-unknown-unknown`: the in-browser compiler target the `ipe-wasm`
#     frontend crate at `src/wasm` builds for the browser playground.
#   - `wasm32-wasip1`: the co-located portable WASI target. The runtime's
#     `_WASI_EFFECT_FLOOR_SEAL` (a compile-time const naming every effect kernel
#     a co-located `Direct` program reaches) is only evaluated on a wasip1 build,
#     so this target must be present or the SEAL is decorative (the `wasm-floor`
#     CI job builds it; see `.github/workflows/ci.yml`).
#   - `x86_64-unknown-linux-musl` / `aarch64-unknown-linux-musl`: the
#     fully-static deploy targets `ipe dev build --static` / `ipe dev run --static`
#     link (see `static.yml`, `release.yml`); the pinned toolchain must have
#     them or the static preflight fails with `TargetNotInstalled`.
targets = [
    "wasm32-unknown-unknown",
    "wasm32-wasip1",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
