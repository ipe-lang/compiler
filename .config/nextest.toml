# Nextest configuration for the Ipê workspace.
#
# Per-test timeout policy:
# - default profile: warn at 60s, terminate after 2 periods (120s). Individual
#   golden tests build+run one emitted binary and should never approach 60s on a
#   warm target; the 120s ceiling catches legitimately hung tests.
# - ci profile (--profile ci, used in CI jobs): warn at 60s, terminate after
#   5 periods (300s). The heavy server/watch binaries that drive a real
#   `cargo build` keep a wider override below; each test's own wait-budget
#   (e.g. `wait_for_body(..., Duration::from_mins(4))`) is the functional guard.

[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
# Fail-fast per-test cap: every test is TERMINATED (and so FAILS) if it exceeds
# 300s (5 × 60s). With the warm dependency cache (each emitted app builds fresh
# but reuses the pre-built dep tree) even the heaviest emit→build→run SEAL test
# finishes in a few minutes on a cold runner, so no legitimate test approaches
# this cap — but a genuine HANG (a wedged `cargo build`, a server that never
# binds) now fails in minutes with a clear terminate, never the 90-minute
# straggler that eats a whole shard. A handful of full-stdlib sweeps that
# legitimately need longer keep their own wider override below; everything else
# lives under this cap.
slow-timeout = { period = "60s", terminate-after = 5 }

# Per-test results (name, duration, outcome) as JUnit XML at
# `target/nextest/ci/junit.xml` under the workspace root. The `test-run`,
# `e2e` and `runtime-full-features-run` jobs upload it, so a slow test that
# never fails is visible across runs.
[profile.ci.junit]
path = "junit.xml"

# Serialized resource groups. A group caps how many of its members run at once;
# use it only for tests that contend on a resource a code fix cannot isolate.
#
# `heavy-server-e2e` (max 1): each member spawns a REAL `ipe dev watch` / server
# subprocess that cold-`cargo build`s a full axum/tokio crate into the one shared
# emitted-crate target and then binds a real TCP port. Run in parallel these
# starve each other's cold build (read as a spurious teardown/serve-budget
# timeout) and fight over the shared target's cargo lock. Serializing them makes
# the cold-build subprocess tests deterministic without loosening any assertion.
#
# Also covers `test_command` and `verify` E2E tests, and the
# `stdlib_coverage_dynamic` build+run column: each spawns the `ipe` binary which
# invokes `cargo build` into the same shared emitted-crate target. Running them
# concurrently produces "Blocking waiting for file lock" on the cargo target
# lock, which under the ci profile's 600 s ceiling is a real flake vector rather
# than a hang. Serializing into this group is exact because the contended
# resource is identical to the server-e2e group's shared target.
#
# `cwd-mutating` (max 1): each member calls `std::env::set_current_dir`, which
# mutates the process-global working directory. Two such tests running
# concurrently in the same nextest process interleave their cwd changes —
# test A sets the cwd to its temp dir, test B immediately overwrites it, test A
# then calls `default_entry()` which stats files relative to the wrong directory.
# Serializing them eliminates the race without changing any assertion.
#
# `advisory-db-lock` (max 1): each member spawns `ipe package audit`, whose
# supply-chain check shells out to `cargo-deny check advisories`. cargo-deny
# opens the RustSec advisory database under a single global lock file
# (`$CARGO_HOME/advisory-dbs/db.lock`) shared by every concurrent invocation on
# the host. Two audits running at once race that lock — a non-deterministic
# open/fetch failure that a code fix inside the audit cannot isolate without
# forcing a per-invocation re-fetch of the whole advisory database (a network
# and offline-run regression). The shared lock is the contended resource, so
# serializing the audit-spawning binaries is the exact-shape fix the
# server-e2e group uses for the shared cargo target lock.
#
# `wasm-external-cargo` (max 1): the wasm-hydration seal test spawns an external
# `cargo check --target wasm32-unknown-unknown` on the emitted crate. Run
# concurrently with the shard's other heavy cargo builds it contends the global
# cargo registry/target lock and cold-compiles the wasm dependency graph under
# load — the transient failure a `retries` override used to mask. Serializing it
# (paired with the test's own stable, warm wasm target dir) removes the race:
# one wasm check runs at a time, against a target that compiled its deps once.
#
# `windows-junction` (max 2): each member plants a junction through the
# `output_dir::test_links` helper, which the first caller compiles with a cold
# PowerShell `Add-Type` build while the others wait on its build lock for at
# most `BUILD_LOCK_WAIT` (240 s, under the `ci` cap of 300 s; the
# `build_lock_wait_stays_under_the_ci_test_cap` test pins both). Capping the
# group at two keeps that build from being starved by every core running the
# rest of the suite. Every caller of the helper names `junction`.
[test-groups]
heavy-server-e2e = { max-threads = 1 }
windows-junction = { max-threads = 2 }
cwd-mutating = { max-threads = 1 }
advisory-db-lock = { max-threads = 1 }
wasm-external-cargo = { max-threads = 1 }

# The heavy-server-e2e members cold-`cargo build` a full axum/tokio crate and
# bind a real TCP port. Serialization (max-threads = 1) removes the shared-target
# lock contention. No test retries — here or in any profile: a test that fails
# once and passes on a retry is nondeterministic, and a retry would report it
# green. It fails its shard instead; `.github/ci/rerun_policy.py --lint` refuses
# any `retries` setting, and the workflow-level rerun fires only on an
# infrastructure signature, never on a test failure.
#
# `slow-timeout` here (900s) is a wide OUTER net, deliberately NOT the fail-fast
# hang guard: the emitted-build harness (`e2e_support::run_bounded_build`) now
# kills a genuinely wedged build on a no-forward-progress *inactivity* watchdog
# (silence ≥ 180s) — inside the test, returning a fast Err — so a real hang dies
# in minutes regardless of this cap. That frees this ceiling to be wide enough
# that a slow-but-PROGRESSING cold build (a missing dep cache / down sccache, up
# to several minutes) is never terminated by wall-clock. A tighter cap here would
# re-couple the SEAL verdict to runner load — the exact flake the watchdog fixes.
# 900s stays under the harness's 1800s absolute backstop and the 30-min shard job
# cap, so the layering is: idle watchdog (fast hang guard) < this net < backstop.
[[profile.ci.overrides]]
filter = 'binary(watch_sigterm) | binary(watch_integration) | binary(watch_hot_appearance) | binary(watch_bluegreen) | binary(server_e2e) | binary(live_e2e) | binary(http_e2e) | binary(g_http_live) | binary(webview_e2e) | binary(watch_cancellation) | binary(secured_store_e2e) | binary(test_command) | binary(verify) | binary(stdlib_coverage_dynamic)'
test-group = 'heavy-server-e2e'
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.ci.overrides]]
filter = 'binary(build_no_arg) | binary(release_subcommand)'
test-group = 'cwd-mutating'

[[profile.ci.overrides]]
filter = 'package(ipe) & kind(lib) & test(/junction/)'
test-group = 'windows-junction'

# The audit integration binaries spawn `ipe package audit`, whose supply-chain
# check runs `cargo-deny check advisories` against the single host-global RustSec
# advisory-db lock. Serialize them so at most one holds that lock at a time.
[[profile.ci.overrides]]
filter = 'binary(package_audit) | binary(audit_native)'
test-group = 'advisory-db-lock'

# `every_listed_module_is_queryable` serially spawns one `ipe doc <name>`
# subprocess per documented stdlib module (~165 at the time of writing). Each
# subprocess takes several seconds on a cold debug binary, so the total
# legitimately exceeds the default 600 s ceiling on a CI runner. 1800 s (30
# periods) is a safe ceiling for the full stdlib sweep.
[[profile.ci.overrides]]
filter = 'test(every_listed_module_is_queryable)'
slow-timeout = { period = "60s", terminate-after = 30 }

# The `stdlib_coverage_dynamic` build+run column drives a real `cargo build` per
# higher-order stdlib symbol across a representative slice — one test that builds
# MANY emitted crates in sequence. Even with the warm dep cache the whole slice
# is legitimately long (its cost is the count of emitted crates it builds, not a
# hang), so it keeps a wider 900s (15-period) window. Not 1800s: warm deps roughly
# halve each per-symbol build, so the slice fits comfortably under 900s while a
# genuine wedge still fails within it.
#
# `g_http_live` is intentionally NOT in this list. Its goldens build through
# `e2e_support::build_rust_binary`, which reuses the warm shared dependency
# target, so each emitted HTTP project links in a handful of seconds rather than
# cold-building axum/tokio — they fit the profile's 300s fail-fast cap, and a
# hung one fails in minutes instead of eating a whole shard.
[[profile.ci.overrides]]
filter = 'binary(stdlib_coverage_dynamic)'
slow-timeout = { period = "60s", terminate-after = 15 }

# The parity probes compile every golden fixture of their shard twice (clean +
# incremental); under CI load a shard can outrun the default ceiling, so give
# the parity binaries a wider terminate window.
[[profile.ci.overrides]]
filter = 'binary(clean_vs_incremental_parity) | binary(per_module_typecheck_parity)'
slow-timeout = { period = "60s", terminate-after = 20 }

# The wasm-hydration gate spawns `cargo check --target wasm32-unknown-unknown` on
# an emitted crate. The contended resource is the global cargo registry/target
# lock plus a cold wasm-dep compile; serializing the check into its own group —
# paired with the test's stable, warm wasm target dir — removes the race at its
# root, so no retry mask is needed and a real failure stays visible.
[[profile.ci.overrides]]
filter = 'test(hydrate_glue_type_name_matches_emitted_struct_and_compiles_for_wasm)'
test-group = 'wasm-external-cargo'

[[profile.default.overrides]]
filter = 'test(hydrate_glue_type_name_matches_emitted_struct_and_compiles_for_wasm)'
test-group = 'wasm-external-cargo'

[[profile.default.overrides]]
filter = 'binary(watch_sigterm) | binary(watch_integration) | binary(watch_hot_appearance) | binary(watch_bluegreen) | binary(server_e2e) | binary(live_e2e) | binary(http_e2e) | binary(g_http_live) | binary(webview_e2e) | binary(watch_cancellation) | binary(secured_store_e2e) | binary(test_command) | binary(verify) | binary(stdlib_coverage_dynamic)'
test-group = 'heavy-server-e2e'

[[profile.default.overrides]]
filter = 'binary(build_no_arg) | binary(release_subcommand)'
test-group = 'cwd-mutating'

[[profile.default.overrides]]
filter = 'package(ipe) & kind(lib) & test(/junction/)'
test-group = 'windows-junction'

[[profile.default.overrides]]
filter = 'binary(package_audit) | binary(audit_native)'
test-group = 'advisory-db-lock'
