[package]
name = "ipe-index"
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-typescript = "0.21"

[build-dependencies]
blake3 = "1"

[dev-dependencies]
icu_properties = "2"
unicode-general-category = "1"

[lints.rust]
# Mirrors the compiler workspace's `unsafe_code` deny for this standalone tool.
unsafe_code = "deny"

[lints.clippy]
# Mirrors the workspace `mem_forget` deny: a forgotten `Drop` guard leaks.
mem_forget = "deny"

[profile.dev]
debug = 0

# Standalone dev tool — detached from the compiler workspace so it keeps its own
# edition/lints and its own target dir.
[workspace]
