# Dependency update proposals. Compatible updates are one grouped PR per
# ecosystem per week; every breaking update is its own PR, so a migration is
# reviewed and gated alone and never blocks the compatible batch. A release must
# be public for a week before it is proposed, so a compromised publish has time
# to be yanked first. Updates land through the same required checks and
# code-owner review as any PR (this file is under `/.github/` in CODEOWNERS).
#
# The open-PR limits sum to the repository's open-PR budget (verify-manifest
# check 18): the grouped actions batch needs one slot; cargo gets two, one for
# its patch batch and one for a breaking update under review.
#
# Cargo treats a `0.x` minor bump as breaking, but Dependabot calls it `minor`,
# so the cargo group holds only patch updates; minor and major ones each get a
# PR of their own.
version: 2
updates:
  - package-ecosystem: github-actions
    # A pin bump needs `python3 .github/ci/action_metadata.py --write`
    # committed on its PR, or artifact-guard (verify-manifest check 24) stays red.
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    # The one lock that resolves the workspace graph; verify-manifest check 14
    # refuses a directory that holds no lock of its own graph.
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      cargo:
        patterns: ["*"]
        update-types: [patch]
    commit-message:
      prefix: chore
      include: scope
