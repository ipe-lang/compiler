name: Free runner disk space
description: >-
  Reclaim preinstalled toolchains the workspace's own build never uses
  (the Android SDK, the .NET SDK, GHC, the CodeQL bundle) plus any cached
  Docker images, so a disk-hungry step later in the same job (a nextest
  archive, a feature-combo build) has headroom on a stock GitHub-hosted
  runner. Each reclaim is independent and non-fatal: a toolchain a future
  runner image drops or relocates must not fail the job over space that is
  already gone.

runs:
  using: composite
  steps:
    - name: Remove unused preinstalled toolchains and prune Docker images
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        sudo docker image prune --all --force || true
        df -h /
