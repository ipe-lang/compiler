name: Install apt packages
description: >-
  The one apt package install every CI job runs (ci/verify-manifest.py check
  27 refuses any other). Each of three attempts first completes an install an
  earlier cap interrupted mid-unpack, then updates and installs with apt's own
  download retries; every command is capped at six minutes and at what is left
  of one fifteen-minute budget for the whole install, and is killed thirty
  seconds after its cap if it ignores the stop. The first attempt uses the
  runner's own Ubuntu mirror; each failed attempt repoints every Ubuntu archive
  and security source to the next independent mirror (archive.ubuntu.com, then
  mirrors.edge.kernel.org) before the next, names each source file it
  repointed, and warns, naming the source hosts it found, when it found none
  to repoint. Archives an attempt finished downloading stay in the archive
  directory, so a later attempt fetches only what is still missing. When the
  archive directory is a job's cache, each attempt first asks apt, from the
  index `update` has just verified against its signature, for the name, size
  and SHA-256 of every archive the install needs, and removes every cached
  archive that is not listed or whose size or hash differs (a hash type other
  than SHA-256 or SHA-512 counts as differing), so apt installs only archives
  the signed index vouches for. When every attempt fails the step fails, and
  so does a spent budget.
inputs:
  packages:
    description: Space-separated Debian package names on one line (lower-case ASCII letters, digits and `.+:-`, never a leading `-`).
    required: true
  archives:
    description: >-
      An absolute directory apt keeps fetched archives in, for a job that
      caches them (ASCII letters, digits and `._-` segments, none `.` or
      `..`); every archive in it is checked against the signed index before
      the install. Empty keeps apt's default.
    required: false
    default: ""
  no-install-recommends:
    description: "`true` installs no recommended packages; `false` keeps apt's default."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install the packages
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        APT_ARCHIVES: ${{ inputs.archives }}
        APT_NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
      run: |
        set -euo pipefail
        export LC_ALL=C
        if [[ "$APT_PACKAGES" == *$'\n'* ]]; then
          echo "::error::apt-install: packages must be one line" >&2
          exit 1
        fi
        read -r -a packages <<< "$APT_PACKAGES"
        if [[ ${#packages[@]} -eq 0 ]]; then
          echo "::error::apt-install: no package named" >&2
          exit 1
        fi
        for package in "${packages[@]}"; do
          if [[ ! "$package" =~ ^[a-z0-9][a-z0-9.+:-]*$ ]]; then
            echo "::error::apt-install: '${package}' is not a Debian package name" >&2
            exit 1
          fi
        done
        install_flags=(-y)
        archive_flags=()
        declare -A listed=()
        uri_line="^'[^']+' ([A-Za-z0-9][A-Za-z0-9.+~%_-]*[.]deb) ([0-9]+) ([A-Za-z0-9-]+):([0-9a-f]+)$"
        case "$APT_NO_RECOMMENDS" in
          true) install_flags+=(--no-install-recommends) ;;
          false) ;;
          *)
            echo "::error::apt-install: no-install-recommends must be true or false" >&2
            exit 1
            ;;
        esac
        if [[ -n "$APT_ARCHIVES" ]]; then
          if [[ ! "$APT_ARCHIVES" =~ ^(/[A-Za-z0-9._-]+)+$ || "$APT_ARCHIVES/" == */../* || "$APT_ARCHIVES/" == */./* ]]; then
            echo "::error::apt-install: archives must be an absolute directory with no . or .. segment" >&2
            exit 1
          fi
          if [[ ! "${RUNNER_TEMP:-}" =~ ^(/[A-Za-z0-9._-]+)+$ || ! -d "$RUNNER_TEMP" ]]; then
            echo "::error::apt-install: RUNNER_TEMP must be an existing absolute directory to list the signed archives in" >&2
            exit 1
          fi
          mkdir -p "$APT_ARCHIVES/partial"
          archive_flags=(-o "Dir::Cache::archives=$APT_ARCHIVES")
          listing_dir="$(mktemp -d -p "$RUNNER_TEMP" apt-listing.XXXXXX)"
          mkdir "$listing_dir/partial"
          listing="$listing_dir/uris"
        fi
        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        mirrors=("" archive.ubuntu.com mirrors.edge.kernel.org)
        source_host='://([A-Za-z0-9.-]*\.)?(archive|security)\.ubuntu\.com/'
        deadline=$((SECONDS + 900))
        for attempt in 1 2 3; do
          mirror="${mirrors[attempt - 1]}"
          if [[ -n "$mirror" ]]; then
            repointed=0
            for list in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [[ -f "$list" ]] && grep -qE "$source_host" "$list"; then
                sudo sed -i -E "s#${source_host}#://${mirror}/#g" "$list"
                echo "apt attempt $attempt repoints $list to $mirror"
                repointed=$((repointed + 1))
              fi
            done
            if ((repointed == 0)); then
              found=()
              for list in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
                if [[ -f "$list" ]]; then
                  found+=("$list")
                fi
              done
              hosts=""
              if ((${#found[@]} > 0)); then
                hosts="$(grep -ohE '://[A-Za-z0-9.-]+' -- "${found[@]}" | cut -c4- | sort -u | sed -n '1,8p' | paste -sd ' ' -)" || hosts=""
              fi
              echo "::warning::apt-install: attempt $attempt found no Ubuntu archive or security source to repoint (source hosts: ${hosts:-none}), so it retries the same mirrors"
            fi
          fi
          failed=""
          for stage in configure update verify install; do
            left=$((deadline - SECONDS))
            if ((left <= 0)); then
              echo "::error::apt-install: the 15 minute install budget is spent" >&2
              exit 1
            fi
            if ((left > 360)); then
              left=360
            fi
            case "$stage" in
              configure) sudo timeout -k 30 "$left" dpkg --configure -a || failed="$stage" ;;
              update) sudo timeout -k 30 "$left" apt-get "${apt_opts[@]}" update || failed="$stage" ;;
              verify)
                if [[ -n "$APT_ARCHIVES" ]]; then
                  sudo timeout -k 30 "$left" apt-get "${apt_opts[@]}" "${install_flags[@]}" -o Acquire::ForceHash=SHA256 -o "Dir::Cache::archives=$listing_dir" --print-uris install "${packages[@]}" > "$listing" || failed="$stage"
                fi
                ;;
              install) sudo timeout -k 30 "$left" apt-get "${apt_opts[@]}" "${install_flags[@]}" "${archive_flags[@]}" install "${packages[@]}" || failed="$stage" ;;
            esac
            if [[ -n "$failed" ]]; then
              break
            fi
            if [[ "$stage" == verify && -n "$APT_ARCHIVES" ]]; then
              listed=()
              unparsed=0
              while IFS= read -r line; do
                if [[ "$line" != "'"* ]]; then
                  continue
                fi
                if [[ ! "$line" =~ $uri_line ]]; then
                  unparsed=$((unparsed + 1))
                  continue
                fi
                name="${BASH_REMATCH[1]}"
                entry="${BASH_REMATCH[2]} ${BASH_REMATCH[3]} ${BASH_REMATCH[4]}"
                if [[ -n "${listed[$name]+set}" && "${listed[$name]}" != "$entry" ]]; then
                  entry="conflict"
                fi
                listed["$name"]="$entry"
              done < "$listing"
              if ((unparsed > 0)); then
                echo "::warning::apt-install: ${unparsed} archive lines of the signed listing did not parse, so no cached copy of them is kept"
              fi
              kept=0
              removed=0
              shopt -s nullglob dotglob
              debs=("$APT_ARCHIVES"/*.deb)
              shopt -u nullglob dotglob
              for deb in "${debs[@]}"; do
                name="${deb##*/}"
                entry="${listed[$name]-}"
                size=""
                hash_type=""
                digest=""
                read -r size hash_type digest <<< "$entry" || true
                sum=""
                if [[ "$hash_type" == SHA256 && ${#digest} -eq 64 ]]; then
                  sum=sha256sum
                elif [[ "$hash_type" == SHA512 && ${#digest} -eq 128 ]]; then
                  sum=sha512sum
                fi
                actual=""
                if [[ -n "$sum" && -f "$deb" && ! -L "$deb" ]] && [[ "$(stat -c %s -- "$deb")" == "$size" ]]; then
                  actual="$("$sum" -- "$deb")" || actual=""
                fi
                if [[ -n "$actual" && "${actual%% *}" == "$digest" ]]; then
                  kept=$((kept + 1))
                  continue
                fi
                if [[ -d "$deb" && ! -L "$deb" ]]; then
                  echo "::error::apt-install: a cached archive is a directory, so it cannot be removed" >&2
                  exit 1
                fi
                rm -f -- "$deb"
                removed=$((removed + 1))
                if [[ -n "$entry" ]]; then
                  echo "::warning::apt-install: cached ${name} does not match the signed index, so it is removed and fetched again"
                fi
              done
              echo "apt attempt $attempt keeps ${kept} cached archives the signed index lists and removes ${removed}"
            fi
          done
          if [[ -z "$failed" ]]; then
            exit 0
          fi
          echo "apt attempt $attempt failed at $failed or did not finish within its cap"
        done
        echo "::error::apt-install: every mirror failed within the install budget" >&2
        exit 1
