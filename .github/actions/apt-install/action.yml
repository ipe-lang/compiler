name: Install apt packages
description: >-
  The one apt package install every CI job runs (ci/verify-manifest.py check
  27 refuses any other). Each of three attempts first completes an install an
  earlier cap interrupted mid-unpack, then updates and installs with apt's own
  download retries; every command is capped at six minutes and at what is left
  of one fifteen-minute budget for the whole install. The first attempt uses
  the runner's own Ubuntu mirror; each failed attempt repoints every Ubuntu
  archive and security source to the next independent mirror
  (archive.ubuntu.com, then mirrors.edge.kernel.org) before the next. Archives
  an attempt finished downloading stay in the archive directory, so a later
  attempt fetches only what is still missing. When every attempt fails the
  step fails, and so does a spent budget.
inputs:
  packages:
    description: Space-separated Debian package names on one line (lower-case ASCII letters, digits and `.+:-`, never a leading `-`).
    required: true
  archives:
    description: >-
      An absolute directory apt keeps fetched archives in, for a job that
      caches them (ASCII letters, digits and `._-` segments, none `.` or
      `..`); empty keeps apt's default.
    required: false
    default: ""
  no-install-recommends:
    description: "`true` installs no recommended packages; `false` keeps apt's default."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install the packages
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        APT_ARCHIVES: ${{ inputs.archives }}
        APT_NO_RECOMMENDS: ${{ inputs.no-install-recommends }}
      run: |
        set -euo pipefail
        export LC_ALL=C
        if [[ "$APT_PACKAGES" == *$'\n'* ]]; then
          echo "::error::apt-install: packages must be one line" >&2
          exit 1
        fi
        read -r -a packages <<< "$APT_PACKAGES"
        if [[ ${#packages[@]} -eq 0 ]]; then
          echo "::error::apt-install: no package named" >&2
          exit 1
        fi
        for package in "${packages[@]}"; do
          if [[ ! "$package" =~ ^[a-z0-9][a-z0-9.+:-]*$ ]]; then
            echo "::error::apt-install: '${package}' is not a Debian package name" >&2
            exit 1
          fi
        done
        install_flags=(-y)
        case "$APT_NO_RECOMMENDS" in
          true) install_flags+=(--no-install-recommends) ;;
          false) ;;
          *)
            echo "::error::apt-install: no-install-recommends must be true or false" >&2
            exit 1
            ;;
        esac
        if [[ -n "$APT_ARCHIVES" ]]; then
          if [[ ! "$APT_ARCHIVES" =~ ^(/[A-Za-z0-9._-]+)+$ || "$APT_ARCHIVES/" == */../* || "$APT_ARCHIVES/" == */./* ]]; then
            echo "::error::apt-install: archives must be an absolute directory with no . or .. segment" >&2
            exit 1
          fi
          mkdir -p "$APT_ARCHIVES/partial"
          install_flags+=(-o "Dir::Cache::archives=$APT_ARCHIVES")
        fi
        apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        mirrors=("" archive.ubuntu.com mirrors.edge.kernel.org)
        deadline=$((SECONDS + 900))
        for attempt in 1 2 3; do
          mirror="${mirrors[attempt - 1]}"
          if [[ -n "$mirror" ]]; then
            echo "apt attempt $attempt repoints the Ubuntu sources to $mirror"
            for list in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [[ -f "$list" ]]; then
                sudo sed -i -E "s#://([A-Za-z0-9.-]*\.)?(archive|security)\.ubuntu\.com/#://${mirror}/#g" "$list"
              fi
            done
          fi
          failed=""
          for stage in configure update install; do
            left=$((deadline - SECONDS))
            if ((left <= 0)); then
              echo "::error::apt-install: the 15 minute install budget is spent" >&2
              exit 1
            fi
            if ((left > 360)); then
              left=360
            fi
            case "$stage" in
              configure) sudo timeout "$left" dpkg --configure -a || failed="$stage" ;;
              update) sudo timeout "$left" apt-get "${apt_opts[@]}" update || failed="$stage" ;;
              install) sudo timeout "$left" apt-get "${apt_opts[@]}" "${install_flags[@]}" install "${packages[@]}" || failed="$stage" ;;
            esac
            if [[ -n "$failed" ]]; then
              break
            fi
          done
          if [[ -z "$failed" ]]; then
            exit 0
          fi
          echo "apt attempt $attempt failed at $failed or did not finish within its cap"
        done
        echo "::error::apt-install: every mirror failed within the install budget" >&2
        exit 1
