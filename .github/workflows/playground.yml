name: Playground jail

# Gate: build the playground bundle (ipe-wasm) + jail-runner and run the
# sandbox security tests so a change that breaks either fails CI.
#
# Both work jobs run in the tests phase (CONTRIBUTING.md "CI
# phases"): in the merge queue on the combined tree unless the fail-closed
# classifier (.github/ci/change_class.py, `playground` scope) proves every
# changed path irrelevant, and nightly always. A pull request runs only
# `playground-changes` and the `playground-jail` phase verdict.
#
#   build                — cargo build -p ipe-wasm (wasm32) and
#                          -p playground-jail-runner: the bundle and jail-runner
#                          compile end-to-end.
#   playground-jail-run  — cargo nextest run -p playground-jail-runner, which
#                          includes sandbox_security.rs (IPE_PLAYGROUND_E2E=1).
#   playground-jail      — the required verdict over both.

on:
  pull_request:
  merge_group:
  schedule:
    - cron: '37 4 * * *'   # nightly, offset from ci.yml
  workflow_dispatch: {}

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Change classification and phase membership: `playground` is `false` only when every changed path
  # is PROSE or an unrelated `src/` tree (.github/ci/change_class.py). Any other
  # path (examples/, .github/, tools/, root files), an unreadable diff, or a
  # classifier crash runs the jail.
  changes:
    # Unique context: a required `changes` shared with ci.yml would be ambiguous.
    name: playground-changes
    runs-on: ubuntu-latest
    outputs:
      # Phase membership by event, as ci.yml's `changes` (verify-manifest check 11).
      cheap: ${{ github.event_name != 'push' }}
      tests: ${{ github.event_name != 'pull_request' && github.event_name != 'push' }}
      post_merge: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
      # An unset output (classifier crash) reads as `true`: absent proof, run.
      playground: ${{ steps.classify.outputs.playground != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tested merge commit and its base parent, for the changed-path diff;
          # a merge-group run needs history back to the queue base.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '2' }}
      - name: Classify changed paths
        id: classify
        # A crash leaves the output unset, which the job output reads as `true`.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python3 .github/ci/change_class.py --playground

  # Build the wasm bundle and the jail-runner binary. This is the primary rot
  # guard: a compile break here fails fast without needing bwrap on the runner.
  build:
    name: playground-build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tests == 'true' && needs.changes.outputs.playground == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain-pinned
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build ipe-wasm (wasm32-unknown-unknown)
        run: cargo build -p ipe-wasm --target wasm32-unknown-unknown --release

      - name: Build playground-jail-runner
        run: cargo build -p playground-jail-runner

  # Run the jail-runner unit tests and, when bwrap is available, the full
  # sandbox security proofs (IPE_PLAYGROUND_E2E=1).
  playground-jail-run:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tests == 'true' && needs.changes.outputs.playground == 'true'
    timeout-minutes: 20
    env:
      IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain-pinned
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@23d41aa71228a2692ee31bb433f070fd4bdc6661 # nextest
        with:
          tool: nextest@0.9.146

      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Build ipe (needed by sandbox_security.rs emit helpers)
        run: cargo build -p ipe

      - name: Allow unprivileged user namespaces (bwrap netns)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run jail-runner tests (unit + sandbox security proofs)
        env:
          IPE_BIN: ${{ github.workspace }}/target/debug/ipe
          IPE_PLAYGROUND_E2E: "1"
        run: cargo nextest run -p playground-jail-runner --profile ci

  # Required `playground-jail` context: the tests-phase verdict over both jobs.
  playground-jail:
    runs-on: ubuntu-latest
    needs: [changes, build, playground-jail-run]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/phase-verdict
      - name: Judge the aggregated jobs
        uses: ./.github/actions/phase-verdict
        with:
          results: >-
            changes=${{ needs.changes.result }}
            build=${{ needs.build.result }}
            playground-jail-run=${{ needs.playground-jail-run.result }}
          phase: tests
          tier: ${{ needs.changes.outputs.tests }}
          scope: ${{ needs.changes.outputs.playground }}
