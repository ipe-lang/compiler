name: nightly-green

# A red nightly blocks the next merge. `nightly-green` is a required context:
# it passes only when every workflow producing a `nightly-gate` context in
# `.github/ci/check-manifest.yml` (admission-sandbox.yml, ci.yml dispatched by
# nightly-full-gate.yml, ruleset-admin-read.yml, static.yml) is proven green,
# each in one of two ways: its newest concluded nightly run on main is at most
# 48h old and every `nightly-gate` job in it concluded `success` (every other
# job `success` or `skipped`, a non-blocking one aside), or a run of it
# dispatched on this change's own commit passed (the recovery path for the PR
# that fixes a red nightly: `gh workflow run <workflow> --ref <branch>`, then
# re-run this check; ruleset-admin-read.yml runs on main only, see
# `.github/ci/RECONCILIATION.md`). Absence is not a pass. The rule and its
# producer table live in `.github/ci/nightly_green.py`, the one file the sparse
# checkout below materialises; its `--lint` (artifact-guard) pins this wiring
# and asserts the table equal to what the manifest and each producer's
# triggers derive.
on:
  pull_request:
  merge_group:

permissions:
  actions: read     # list every producer's runs and read their jobs (repository-wide)
  contents: read    # compare a run's commit against main
  pull-requests: read  # merge_group: resolve the queued PR's head commit

concurrency:
  group: nightly-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-green:
    name: nightly-green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the verdict module is materialised; no credential stays in git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/ci/nightly_green.py
          sparse-checkout-cone-mode: false

      - name: Require a green full gate (latest nightly, or this commit)
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/ci/nightly_green.py --verdict
