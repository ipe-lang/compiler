# ─────────────────────────────────────────────────────────────────────────────
# Admission sandbox matrix — per-platform isolation proof harness.
#
# Purpose: for each of the 5 platforms we ship binaries for, run a sample
# "untrusted build" inside that platform's off-the-shelf jail and assert the
# isolation contract holds:
#   • no network (a socket/connect attempt is DENIED)
#   • read-only FS except one scratch dir (a write outside scratch is DENIED)
#   • resource + wall-clock caps
#   • non-root
#   • scrubbed env
#   • a benign build SUCCEEDS inside the jail (no false-deny)
#
# Each platform also runs a POSITIVE CONTROL outside the jail: the same net +
# fs-escape actions must SUCCEED there, so a block under the jail is proven to be
# the jail — not an unreachable host or an already-unwritable path.
#
# This is the reusable substrate the SP4 admission gate will wrap. It does NOT
# depend on `ipe package audit`; it jails an arbitrary build command and proves
# the jail holds. See ADRs 0040/0041; the per-platform admission-matrix that
# wraps this substrate is tracked as a GitHub issue.
#
# Fail-closed invariant: where a jail backend CAN exist on the runner, a jail
# that fails to establish makes that job RED, never green-by-skip — absence of a
# working jail = that platform is not safe to admit for. The one confirmed
# exception is the Windows job on GitHub-HOSTED runners, which do not ship a
# Windows-container-mode Docker daemon at all: there the backend is provably
# absent, so the job SKIPS with a loud "UNVERIFIED" job-summary note (issue #186)
# instead of a permanent, signal-free RED. On a Windows-container-capable runner
# the backend is present and the real fail-closed path runs.
#
# Platform jail map (spec §1.1):
#   linux-x64   — container --network none (outer) + bubblewrap (inner); AND-composed
#   linux-arm64 — same layering on ubuntu-24.04-arm runner
#   macos-arm64 — sandbox-exec (Seatbelt SBPL profile)
#   windows-x64 — Docker Windows container, --isolation process, --network none
#   freebsd-x64 — vmactions/freebsd-vm VM + jail(8); reuses release.yml infra
# ─────────────────────────────────────────────────────────────────────────────
name: Sandbox

# Phases (CONTRIBUTING.md "CI phases"): the three required legs' jail proofs
# run in the tests phase — once in the merge queue on the combined tree, and
# nightly — and each reports through its required phase verdict. The Windows
# and FreeBSD proofs run in the post-merge phase (nightly and on dispatch),
# because no required verdict aggregates them. A pull request runs only
# `admission-changes` and the three phase verdicts, which pass vacuously there.
on:
  pull_request:
  schedule:
    - cron: '17 3 * * *'   # nightly, offset from ci.yml / security.yml
  merge_group:
  workflow_dispatch: {}

# The event is part of the group, so a nightly run and a dispatch run on the
# same ref never cancel each other; a newer pull-request push supersedes an
# older one, and a re-queued merge-group run supersedes the stale run on its
# queue ref (the queue re-creates a ref only on re-entry).
concurrency:
  group: admission-sandbox-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

permissions:
  contents: read

jobs:
  # Change classification and phase membership — the same fail-closed `code`
  # scope as ci.yml (.github/ci/change_class.py, whose PROSE set ci.yml's
  # `changes` guards). An unreadable diff or a classifier crash yields
  # `code == 'true'` and every proof runs at full strictness.
  changes:
    # Unique context: a required `changes` shared with ci.yml would be ambiguous.
    name: admission-changes
    runs-on: ubuntu-latest
    outputs:
      # Phase membership by event, as ci.yml's `changes` (verify-manifest check 11).
      cheap: ${{ github.event_name != 'push' }}
      tests: ${{ github.event_name != 'pull_request' && github.event_name != 'push' }}
      post_merge: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
      # An unset output (classifier crash) reads as `true`: absent proof, run.
      code: ${{ steps.classify.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tested merge commit and its base parent, for the changed-path diffs;
          # a merge-group run needs history back to the queue base.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '2' }}
      - name: Classify changed paths
        id: classify
        # A crash leaves the output unset, which the job output reads as `true`.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python3 .github/ci/change_class.py --code

  # ── Linux x64 ──────────────────────────────────────────────────────────────
  # Outer network-denial layer: seccomp socket-deny profile applied via
  # `docker run --security-opt seccomp=...` on the host runner. This denies
  # all socket(2) calls before any process inside can open a connection.
  # Inner FS-isolation layer: bubblewrap (bwrap) read-only rootfs + isolated
  # pid/uts/ipc namespaces + single writable scratch dir.
  # The two layers are AND-composed; either alone would suffice but both are
  # required (redundancy is the spec's stated intent, not an accident).
  #
  # Why not docker run --network none: GHA's container job model already
  # conflicts with --network none (round-1 error). Why not apt-get inside
  # --network none: apt needs the network to download packages.
  # Solution: install bwrap and python3 on the runner host before entering
  # the container, then invoke jail-linux.sh directly on the host. The seccomp
  # socket-deny profile is the outer network layer.
  linux-x64-jail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.tests == 'true' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bubblewrap and python3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap python3

      - name: Make scripts executable
        run: chmod +x tools/scripts/admission/jail-linux.sh tests/fixtures/admission/untrusted-build.sh

      # Positive control: OUTSIDE the jail, as the same root principal, net +
      # fs-escape must SUCCEED — so a block in the enforce run below can only be
      # the jail, not an unreachable host or an already-unwritable path.
      - name: Positive control (no jail — forbidden actions must succeed)
        env:
          ESCAPE_PATH: ${{ github.workspace }}/admission-escape-probe
        run: sudo -E env PROBE_MODE=control ESCAPE_PATH="$ESCAPE_PATH" sh tests/fixtures/admission/untrusted-build.sh

      - name: Run admission jail
        env:
          ADMISSION_TIMEOUT_SECS: '60'
          ESCAPE_PATH: ${{ github.workspace }}/admission-escape-probe
        # sudo: bwrap needs root to set up uid/gid maps on GHA runners
        # (the runner user has no /etc/subuid entry).
        run: sudo -E tools/scripts/admission/jail-linux.sh tests/fixtures/admission/untrusted-build.sh

  # Required `linux-x64 (seccomp socket-deny + bubblewrap)` context:
  # the tests-phase verdict over `linux-x64-jail`.
  linux-x64:
    name: linux-x64 (seccomp socket-deny + bubblewrap)
    runs-on: ubuntu-latest
    needs: [changes, linux-x64-jail]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/phase-verdict
      - name: Judge the aggregated jobs
        uses: ./.github/actions/phase-verdict
        with:
          results: >-
            changes=${{ needs.changes.result }}
            linux-x64-jail=${{ needs.linux-x64-jail.result }}
          phase: tests
          tier: ${{ needs.changes.outputs.tests }}
          scope: ${{ needs.changes.outputs.code }}

  # ── Linux arm64 ────────────────────────────────────────────────────────────
  # Identical layering to linux-x64, on a native arm64 runner.
  linux-arm64-jail:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.tests == 'true' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bubblewrap and python3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap python3

      - name: Make scripts executable
        run: chmod +x tools/scripts/admission/jail-linux.sh tests/fixtures/admission/untrusted-build.sh

      # Positive control: OUTSIDE the jail, as the same root principal (see linux-x64).
      - name: Positive control (no jail — forbidden actions must succeed)
        env:
          ESCAPE_PATH: ${{ github.workspace }}/admission-escape-probe
        run: sudo -E env PROBE_MODE=control ESCAPE_PATH="$ESCAPE_PATH" sh tests/fixtures/admission/untrusted-build.sh

      - name: Run admission jail
        env:
          ADMISSION_TIMEOUT_SECS: '60'
          ESCAPE_PATH: ${{ github.workspace }}/admission-escape-probe
        # sudo: bwrap needs root to set up uid/gid maps on GHA runners
        run: sudo -E tools/scripts/admission/jail-linux.sh tests/fixtures/admission/untrusted-build.sh

  # Required `linux-arm64 (seccomp socket-deny + bubblewrap)` context:
  # the tests-phase verdict over `linux-arm64-jail`.
  linux-arm64:
    name: linux-arm64 (seccomp socket-deny + bubblewrap)
    runs-on: ubuntu-latest
    needs: [changes, linux-arm64-jail]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/phase-verdict
      - name: Judge the aggregated jobs
        uses: ./.github/actions/phase-verdict
        with:
          results: >-
            changes=${{ needs.changes.result }}
            linux-arm64-jail=${{ needs.linux-arm64-jail.result }}
          phase: tests
          tier: ${{ needs.changes.outputs.tests }}
          scope: ${{ needs.changes.outputs.code }}

  # ── macOS arm64 ────────────────────────────────────────────────────────────
  # Jail: sandbox-exec(1) with an SBPL profile (Seatbelt).
  # Network is denied at the SBPL level (deny network*).
  # FS writes are restricted to the scratch dir.
  macos-arm64-jail:
    runs-on: macos-latest
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.tests == 'true' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make scripts executable
        run: chmod +x tools/scripts/admission/jail-macos.sh tests/fixtures/admission/untrusted-build.sh

      # Positive control: OUTSIDE the jail, as the same user principal, net +
      # fs-escape must SUCCEED (the workspace path is outside the SBPL allow-list
      # jailed, but user-writable unjailed).
      - name: Positive control (no jail — forbidden actions must succeed)
        env:
          ESCAPE_PATH: ${{ github.workspace }}/admission-escape-probe
        run: PROBE_MODE=control ESCAPE_PATH="$ESCAPE_PATH" sh tests/fixtures/admission/untrusted-build.sh

      - name: Run admission jail
        env:
          ADMISSION_TIMEOUT_SECS: '60'
          ESCAPE_PATH: ${{ github.workspace }}/admission-escape-probe
        run: tools/scripts/admission/jail-macos.sh tests/fixtures/admission/untrusted-build.sh

  # Required `macos-arm64 (sandbox-exec / Seatbelt)` context:
  # the tests-phase verdict over `macos-arm64-jail`.
  macos-arm64:
    name: macos-arm64 (sandbox-exec / Seatbelt)
    runs-on: ubuntu-latest
    needs: [changes, macos-arm64-jail]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/phase-verdict
      - name: Judge the aggregated jobs
        uses: ./.github/actions/phase-verdict
        with:
          results: >-
            changes=${{ needs.changes.result }}
            macos-arm64-jail=${{ needs.macos-arm64-jail.result }}
          phase: tests
          tier: ${{ needs.changes.outputs.tests }}
          scope: ${{ needs.changes.outputs.code }}

  # ── Windows x64 ────────────────────────────────────────────────────────────
  # Jail: Docker Windows container with --isolation process --network none.
  # Process-isolation (not Hyper-V) is required because GitHub-hosted runners
  # do not support nested virtualisation.
  #
  # Documented constraint: Docker Windows process-isolation containers require
  # the host and container OS versions to match (servercore:ltsc2022 matches
  # windows-2022). Confirmed result: GitHub-hosted windows-2022 runners do not
  # provide a Windows-container-mode Docker daemon, so the jail cannot be
  # established here — the job skips cleanly with an UNVERIFIED note (issue #186).
  # On a Windows-container-capable runner the jail runs and stays fail-closed.
  windows-x64:
    name: windows-x64 (Docker Windows container, process isolation)
    runs-on: windows-2022
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.post_merge == 'true' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHA windows-2022 runners run Moby Engine (not Docker Desktop) and do NOT
      # provide a Windows-container-mode Docker daemon, so the process-isolation
      # jail cannot be established here. When the backend is absent this job SKIPS
      # cleanly (a loud warning + a job-summary note recording that the Windows
      # jail is UNVERIFIED on hosted CI — NOT a passing proof), rather than a
      # permanent fail-closed RED that can never pass and only hides real
      # failures. On a Windows-container-capable runner the backend IS present, so
      # the real jail path below runs and stays fail-closed. Tracking: #186.
      - name: Detect Windows-container Docker (skip cleanly if absent)
        id: winctr
        shell: powershell
        run: |
          $os = ''
          try { $os = (docker info --format '{{.OSType}}' 2>$null) } catch { $os = '' }
          Write-Host "Docker OS type: '$os'"
          if ($os -eq 'windows') {
            'available=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            'available=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning "Windows-container Docker unavailable on this hosted runner (OSType='$os'); skipping the Windows admission-sandbox proof (not passing it). See issue 186."
            'windows-x64 admission-sandbox: SKIPPED (unverified). GitHub-hosted windows-2022 runners do not provide a Windows-container-mode Docker daemon, so the process-isolation jail proof cannot run here. This is a documented environmental skip, not a passing proof; the Windows jail is UNVERIFIED on hosted CI. Run on a self-hosted Windows-container-capable runner to verify (issue 186).' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          # A missing/Linux-mode daemon makes `docker info` exit non-zero, which
          # leaves $LASTEXITCODE set; the GitHub `powershell` wrapper appends
          # `exit $LASTEXITCODE`, so without this the detection step itself would
          # go RED on the very hosted runners it is meant to skip cleanly on.
          # This is a capability probe, not the proof: reset the code and exit 0
          # so the skip path is neutral. The real proof runs only when
          # available == true (gated steps below) and stays fail-closed there.
          $global:LASTEXITCODE = 0
          exit 0

      # servercore:ltsc2022 ships PowerShell and matches the windows-2022 host OS
      # version (required for process-isolation containers — host and container
      # OS versions must match). The image is pinned by digest below to prevent
      # silent tag drift; the ltsc2022 tag is kept alongside for readability.
      # Pull is retried (up to 3 attempts, 15 s apart) because the MCR endpoint
      # is occasionally flaky on GHA network paths.
      - name: Pull servercore image (with retry)
        if: steps.winctr.outputs.available == 'true'
        shell: powershell
        run: |
          $image = 'mcr.microsoft.com/windows/servercore:ltsc2022'
          $maxAttempts = 3
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "docker pull attempt $i/$maxAttempts"
            docker pull $image
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -lt $maxAttempts) { Start-Sleep -Seconds 15 }
            else {
              Write-Error "docker pull failed after $maxAttempts attempts"
              exit 1
            }
          }

      # Positive control on the host (outside the container): the same net
      # target the container is denied must be reachable here, so the container's
      # block is `--network none`, not an unreachable host. (Host-FS isolation is
      # proven directly by the container's read-only root + unmounted host FS.)
      - name: Positive control (no container — net must succeed on host)
        if: steps.winctr.outputs.available == 'true'
        run: |
          $c = New-Object System.Net.Sockets.TcpClient
          $ar = $c.BeginConnect("github.com", 443, $null, $null)
          $ok = $ar.AsyncWaitHandle.WaitOne(5000, $false)
          if (-not $ok) { Write-Error "control: github.com:443 unreachable on host"; exit 4 }
          try { $c.EndConnect($ar) } catch { Write-Error "control: connect failed: $_"; exit 4 }
          $c.Close()
          Write-Host "PROBE net control: github.com:443 reachable on host -- OK"
        shell: powershell

      - name: Run admission jail
        if: steps.winctr.outputs.available == 'true'
        env:
          ADMISSION_TIMEOUT_SECS: '90'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/scripts/admission/jail-windows.ps1
        shell: powershell

  # ── FreeBSD x64 ────────────────────────────────────────────────────────────
  # No native GitHub FreeBSD runner. Runs inside a vmactions/freebsd-vm VM on
  # an ubuntu host, reusing the same infra as release.yml's build-freebsd job.
  # Jail: FreeBSD jail(8) with ip4=disable ip6=disable (no network) and a
  # read-only rootfs except the scratch dir.
  #
  # The vmactions VM runs as root by default, which is required to create
  # jail(8) instances.
  freebsd-x64:
    name: freebsd-x64 (jail(8) inside vmactions VM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.post_merge == 'true' && needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run admission jail inside FreeBSD VM
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        with:
          usesh: true
          # synctime=false skips the NTP sync that can stall the VM boot on
          # congested GHA runners; the clock drift is irrelevant for jail proofs.
          synctime: false
          prepare: |
            # Retry pkg install up to 3 times to ride out transient mirror flaps.
            i=0; until pkg install -y python3; do
              i=$((i+1)); [ $i -ge 3 ] && exit 1; echo "pkg retry $i/3"; sleep 10
            done
          run: |
            chmod +x tools/scripts/admission/jail-freebsd.sh tests/fixtures/admission/untrusted-build.sh
            # Shared escape path: root-owned repo dir — root-writable unjailed
            # (control), unwritable to the jailed `nobody` (enforce).
            ESCAPE_PATH="$(pwd)/admission-escape-probe"
            echo "== positive control (no jail — forbidden actions must succeed) =="
            PROBE_MODE=control ESCAPE_PATH="$ESCAPE_PATH" \
              sh tests/fixtures/admission/untrusted-build.sh
            echo "== enforce (jailed — forbidden actions must be blocked) =="
            ADMISSION_TIMEOUT_SECS=60 ESCAPE_PATH="$ESCAPE_PATH" \
              tools/scripts/admission/jail-freebsd.sh tests/fixtures/admission/untrusted-build.sh
