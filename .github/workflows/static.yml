# ─────────────────────────────────────────────────────────────────────────────
# Static-compilation gate (design: docs/architecture/static-compilation.md).
#
# Proves the `--static` path end to end, per allocator arm:
#   1. the typed refusal + emit-shape tests (`static_emit.rs`, incl. the
#      IPE_E2E_STATIC musl build/run/ldd proof on the dlmalloc leg);
#   2. a CLI-driven `ipe dev build --static` of a real example, cargo-built
#      standalone for x86_64-unknown-linux-musl with CWD = the emitted crate
#      dir (cargo discovers the generated .cargo/config.toml from CWD);
#   3. `file` + `ldd` assertions — static-ness is asserted, never assumed;
#   4. execution inside a `scratch` container: nothing in the filesystem but
#      the binary itself, so a hidden runtime dependency (dynamic loader,
#      libssl, host cert store, /etc/*) fails loudly here;
#   5. supply-chain: `cargo audit` over the emitted crate's lockfile — static
#      linking freezes every dep into the artifact, so the advisory gate must
#      cover the exact frozen set — with the lockfile uploaded as the
#      version-manifest artifact.
#
# Matrix: dlmalloc (the pure-Rust default) and mimalloc (the explicit C
# opt-in — kept green so the acknowledged path cannot rot).
#
# Jobs also cover the aarch64-unknown-linux-musl static target (cross-built +
# QEMU-run) and the C-free (`--cfree`) axis (fail-closed refusal proof until the
# pure-Rust dependency swaps land).
# ─────────────────────────────────────────────────────────────────────────────
name: Static binaries

# The `--static` musl proof (build + scratch-container run + advisory audit of
# the frozen lockfile) is a slow gate — a POST-MERGE / nightly check, OFF the
# required PR path. Runs on push to the main branches and nightly; not on
# pull_request.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '52 4 * * *'      # nightly, offset from ci.yml / security.yml
  workflow_dispatch: {}

# A push run is keyed by its commit: GitHub replaces a queued run (and
# cancel-in-progress cancels a running one) when a newer run joins its group,
# so a per-ref push group would let one main commit go unbuilt.
concurrency:
  group: static-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-static-x64:
    name: linux-static-x64 (${{ matrix.allocator }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        allocator: [dlmalloc, mimalloc]

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/ipe-lang-target
      IPE_NO_SCCACHE: '1'
      STATIC_TRIPLE: x86_64-unknown-linux-musl
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/rust-toolchain-pinned
        with:
          targets: x86_64-unknown-linux-musl

      # The emitted dep graph carries C compile units (zstd, ring) — the
      # preflight requires a musl-capable C compiler; mimalloc adds its own.
      # bubblewrap + util-linux supply the runtime jail primitives (bwrap,
      # prlimit) `ipe dev run` needs to confine a program; without them a
      # capability-bearing run is refused (IPE-F4413), which the gated
      # `ipe dev run --static` e2e exercises.
      - name: Install musl C toolchain and jail primitives
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools bubblewrap util-linux

      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/ipe-lang-target
          key: ${{ runner.os }}-static-${{ matrix.allocator }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-static-${{ matrix.allocator }}-
            ${{ runner.os }}-static-

      - name: Build ipe
        run: cargo build --release -p ipe

      # Refusal negatives + emit shape + (dlmalloc leg) the gated musl
      # build/run/ldd e2e, including `ipe dev run --static`.
      - name: Static gates (refusals, emit shape, e2e)
        env:
          IPE_E2E_STATIC: ${{ matrix.allocator == 'dlmalloc' && '1' || '' }}
        run: cargo test -p ipe --test static_emit

      - name: ipe dev build --static (example, ${{ matrix.allocator }})
        env:
          ALLOCATOR: ${{ matrix.allocator }}
        run: |
          cd examples/shapes/non-tea/hello-world
          "$CARGO_TARGET_DIR/release/ipe" dev build package.ipe --out out \
            --static --allocator "$ALLOCATOR"
          cd out/rust
          cargo build --release --target "$STATIC_TRIPLE"
          # Cargo names the binary after the emitted crate's `[package] name`,
          # which carries a per-project identity hash (`ipe-app_<hash>`) so
          # sibling projects never collide in a shared target dir. Resolve that
          # name from the manifest cargo just built from — never assume `ipe-app`.
          CI_JOB_BIN_NAME="$(sed -n '/^\[package\]/,/^\[/{s/^name *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)"
          bash "$GITHUB_WORKSPACE/.github/ci/github-env.sh" CI_JOB_BIN_NAME "$CI_JOB_BIN_NAME"

      - name: Assert static-ness (file + ldd)
        run: |
          BIN="$CARGO_TARGET_DIR/$STATIC_TRIPLE/release/$CI_JOB_BIN_NAME"
          file "$BIN"
          file "$BIN" | grep -Eq 'static-pie linked|statically linked'
          LDD_OUT="$(ldd "$BIN" 2>&1 || true)"
          echo "$LDD_OUT"
          echo "$LDD_OUT" | grep -Eq 'statically linked|not a dynamic executable'

      # The zero-runtime-deps proof: a `scratch` image holds NOTHING but the
      # binary — no loader, no libc, no certs, no /etc. It must still run.
      - name: Run in a scratch container
        run: |
          WORK="$(mktemp -d)"
          cp "$CARGO_TARGET_DIR/$STATIC_TRIPLE/release/$CI_JOB_BIN_NAME" "$WORK/ipe-app"
          printf 'FROM scratch\nCOPY ipe-app /ipe-app\nENTRYPOINT ["/ipe-app"]\n' > "$WORK/Dockerfile"
          docker build -t ipe-static-proof "$WORK"
          OUT="$(docker run --rm ipe-static-proof)"
          echo "scratch output: $OUT"
          echo "$OUT" | grep -q 'Hello, Ipê!'

      # Advisory gate over the FROZEN dependency set (the emitted lockfile is
      # exactly what is baked into the static artifact).
      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-audit

      - name: cargo audit (emitted lockfile)
        run: cargo audit --file examples/shapes/non-tea/hello-world/out/rust/Cargo.lock

      - name: Upload frozen-deps manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-frozen-deps-${{ matrix.allocator }}
          path: examples/shapes/non-tea/hello-world/out/rust/Cargo.lock
          if-no-files-found: warn

  # ─── aarch64 static gate ───────────────────────────────────────────────────
  # Cross-compiles the emitted example crate for aarch64-unknown-linux-musl from
  # an x86_64 host. The emitted `.cargo/config.toml` pins the bundled `rust-lld`
  # with `link-self-contained=yes`, so the musl startup objects come from rustup
  # and only the C deps (zstd, ring) need a cross compiler — the widely-packaged
  # `gcc-aarch64-linux-gnu` supplies it (the preflight's `cc_candidates` for this
  # triple probe `aarch64-linux-musl-gcc` then `aarch64-linux-gnu-gcc`).
  # Cross-run verification uses `qemu-user-static`.
  linux-static-arm64:
    name: linux-static-arm64 (dlmalloc)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/ipe-lang-target
      IPE_NO_SCCACHE: '1'
      STATIC_TRIPLE: aarch64-unknown-linux-musl
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/rust-toolchain-pinned
        with:
          targets: aarch64-unknown-linux-musl

      # musl-capable AArch64 C linker + QEMU for cross-run verification.
      # Toolchain: gcc-aarch64-linux-gnu provides the cross-assembler/linker;
      # musl-tools provides musl-libc headers; qemu-user-static enables
      # transparent execution of aarch64 binaries on x86_64.
      - name: Install aarch64 musl C toolchain + QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools qemu-user-static

      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/ipe-lang-target
          key: ${{ runner.os }}-static-arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-static-arm64-

      - name: Build ipe
        run: cargo build --release -p ipe

      - name: ipe dev build --static --target aarch64-unknown-linux-musl
        run: |
          cd examples/shapes/non-tea/hello-world
          "$CARGO_TARGET_DIR/release/ipe" dev build package.ipe --out out \
            --static --target aarch64-unknown-linux-musl --allocator dlmalloc
          cd out/rust
          cargo build --release --target "$STATIC_TRIPLE"
          # Cargo names the binary after the emitted crate's `[package] name`,
          # which carries a per-project identity hash (`ipe-app_<hash>`) so
          # sibling projects never collide in a shared target dir. Resolve that
          # name from the manifest cargo just built from — never assume `ipe-app`.
          CI_JOB_BIN_NAME="$(sed -n '/^\[package\]/,/^\[/{s/^name *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)"
          bash "$GITHUB_WORKSPACE/.github/ci/github-env.sh" CI_JOB_BIN_NAME "$CI_JOB_BIN_NAME"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc

      - name: Assert static-ness (file)
        run: |
          BIN="$CARGO_TARGET_DIR/$STATIC_TRIPLE/release/$CI_JOB_BIN_NAME"
          file "$BIN"
          file "$BIN" | grep -Eq 'static-pie linked|statically linked|ELF 64-bit LSB.*static'

      - name: Run via QEMU
        run: |
          BIN="$CARGO_TARGET_DIR/$STATIC_TRIPLE/release/$CI_JOB_BIN_NAME"
          OUT="$(qemu-aarch64-static "$BIN")"
          echo "qemu output: $OUT"
          echo "$OUT" | grep -q 'Hello, Ipê!'

      - name: Upload frozen-deps manifest (arm64)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-frozen-deps-arm64-dlmalloc
          path: examples/shapes/non-tea/hello-world/out/rust/Cargo.lock
          if-no-files-found: warn

  # ─── C-free build axis gate ────────────────────────────────────────────────
  # The `--cfree` axis models "link no C". Its ADT (`CProfile`) makes the
  # contradiction {c-free, C-requiring-allocator} unrepresentable, and the
  # resolver refuses `--cfree` until the pure-Rust dependency swaps (flate2/zstd
  # codecs, a ring-free rustls provider) land — a build that still pulled C
  # while skipping the C-compiler preflight would lie about its promise. Until
  # those swaps land the gate is a FAIL-CLOSED proof: `--cfree` must refuse,
  # artifact-free, and a C-requiring allocator under `--cfree` must refuse
  # distinctly. When the swaps land this job grows the real emit + no-C build.
  linux-cfree-gate:
    name: linux-cfree-gate (refusal is fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/ipe-lang-target
      IPE_NO_SCCACHE: '1'
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain-pinned

      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/ipe-lang-target
          key: ${{ runner.os }}-cfree-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cfree-
            ${{ runner.os }}-static-

      - name: Build ipe
        run: cargo build --release -p ipe

      # The typed C-free refusals (the CProfile-contradiction test + the
      # fail-closed CfreeNotYetWired test) live in the static_emit suite.
      - name: C-free refusal gates
        run: cargo test -p ipe --test static_emit -- cfree

      # And the CLI itself refuses --cfree end to end, artifact-free.
      - name: ipe dev build --static --cfree is refused
        run: |
          cd examples/shapes/non-tea/hello-world
          if "$CARGO_TARGET_DIR/release/ipe" dev build package.ipe --out out/cfree \
               --static --cfree; then
            echo "::error::--cfree must be refused until the pure-Rust dep swaps land"
            exit 1
          fi
          test ! -e out/cfree || {
            echo "::error::--cfree refusal must be artifact-free (no emitted crate)"; exit 1; }

  # ─── Windows static gate ───────────────────────────────────────────────────
  # `ipe dev build` on Windows emits a standard Cargo project; then `cargo build
  # --release` with `RUSTFLAGS=-C target-feature=+crt-static` links the MSVC
  # CRT statically so the resulting .exe requires no vcruntime*.dll at runtime.
  #
  # NOTE: `ipe dev build --static` is NOT used here. `StaticTriple` in the compiler
  # is a closed enum (only Linux musl targets are in the supported set); passing
  # `--static` on Windows would be refused by the CLI. The RUSTFLAGS approach
  # achieves the same CRT-static result through cargo's supported mechanism.
  #
  # Allocator: dlmalloc is a pure-Rust allocator and compiles without a C
  # toolchain; mimalloc requires MSVC C compilation and is not exercised here.
  # continue-on-error until confirmed green on the runner.
  windows-static:
    name: windows-static (dlmalloc, MSVC +crt-static)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/ipe-lang-target
      IPE_NO_SCCACHE: '1'
      STATIC_TRIPLE: x86_64-pc-windows-msvc
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'
      # Static CRT linkage: produced .exe must not depend on vcruntime*.dll.
      RUSTFLAGS: -C target-feature=+crt-static
      IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
      REPO: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/rust-toolchain-pinned
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/ipe-lang-target
          key: windows-static-dlmalloc-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-static-dlmalloc-

      - name: Build ipe
        run: cargo build --release -p ipe

      - name: ipe dev build (emit Rust for 01-hello-world)
        run: |
          cd "$REPO/examples/shapes/non-tea/hello-world"
          "$CARGO_TARGET_DIR/release/ipe.exe" dev build package.ipe --out out

      - name: cargo build --release (MSVC +crt-static, dlmalloc)
        run: |
          cd "$REPO/examples/shapes/non-tea/hello-world/out/rust"
          cargo build --release --features alloc_dlmalloc
          # Cargo names the binary after the emitted crate's `[package] name`,
          # which carries a per-project identity hash (`ipe-app_<hash>`) so
          # sibling projects never collide in a shared target dir; on Windows the
          # artifact is `<name>.exe`. Resolve the name from the manifest cargo
          # just built from — never assume `ipe-app`.
          CI_JOB_BIN_NAME="$(sed -n '/^\[package\]/,/^\[/{s/^name *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)"
          bash "$GITHUB_WORKSPACE/.github/ci/github-env.sh" CI_JOB_BIN_NAME "$CI_JOB_BIN_NAME"

      # Verify the produced .exe runs and produces expected output.
      # The binary is in the host (x86_64-pc-windows-msvc) release dir.
      - name: Run emitted .exe
        run: |
          EXE="$CARGO_TARGET_DIR/release/${CI_JOB_BIN_NAME}.exe"
          OUT="$("$EXE")"
          echo "emitted-binary output: $OUT"
          echo "$OUT" | grep -q 'Hello, Ipê!'

      - name: Upload frozen-deps manifest (windows)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-frozen-deps-windows-dlmalloc
          path: examples/shapes/non-tea/hello-world/out/rust/Cargo.lock
          if-no-files-found: warn

  # ─── FreeBSD cross-compile gate ────────────────────────────────────────────
  # Cross-compiles the emitted example crate for `x86_64-unknown-freebsd` from
  # an ubuntu host. This is a BUILD-ONLY gate: GitHub has no native FreeBSD
  # runner, so running the FreeBSD ELF on the ubuntu host is not possible (wrong
  # ABI).
  #
  # NOTE: `ipe dev build --static` is NOT used. `StaticTriple` in the compiler is a
  # closed enum (Linux musl only); FreeBSD is not in the supported set. The emitted
  # crate is built for FreeBSD using the `cross` tool (pre-built FreeBSD sysroot
  # Docker image), which is the established way to cross-compile to FreeBSD without
  # a manual sysroot installation.
  #
  # continue-on-error: the cross Docker image availability is a runner-env
  # constraint, not a compiler correctness signal; the job is non-blocking.
  freebsd-cross:
    name: freebsd-cross (x86_64-unknown-freebsd, build-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45

    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/ipe-lang-target
      IPE_NO_SCCACHE: '1'
      FREEBSD_TRIPLE: x86_64-unknown-freebsd
      CARGO_HTTP_MULTIPLEXING: 'false'
      CARGO_NET_RETRY: '5'
      IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/rust-toolchain-pinned
        with:
          targets: x86_64-unknown-freebsd

      - name: Cache cargo target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ${{ github.workspace }}/.cache/ipe-lang-target
          key: freebsd-cross-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            freebsd-cross-

      - name: Install cross
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cross

      - name: Build ipe (host, for emit step)
        run: cargo build --release -p ipe

      - name: ipe dev build (emit Rust for 01-hello-world)
        run: |
          cd examples/shapes/non-tea/hello-world
          "$CARGO_TARGET_DIR/release/ipe" dev build package.ipe --out out

      # Build-only: cross compiles the emitted crate for FreeBSD. Running
      # the resulting ELF on an ubuntu host is not possible (wrong ABI).
      - name: cross build --target x86_64-unknown-freebsd (build-only)
        run: |
          cd examples/shapes/non-tea/hello-world/out/rust
          cross build --release --target "$FREEBSD_TRIPLE"

      - name: Upload frozen-deps manifest (freebsd-cross)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-frozen-deps-freebsd-cross
          path: examples/shapes/non-tea/hello-world/out/rust/Cargo.lock
          if-no-files-found: warn
