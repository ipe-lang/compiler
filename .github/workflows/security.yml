# ─────────────────────────────────────────────────────────────────────────────
# Supply-chain security gate — RustSec advisories + license compliance +
# dependency-source pinning against Cargo.lock. ONE tool: `cargo-deny`.
#
# `cargo-deny`'s `advisories` check subsumes `cargo-audit` (both read the same
# RustSec advisory-db against Cargo.lock), and deny additionally covers
# licenses / bans / sources in one pass — so this is the single supply-chain
# gate. It is lockfile/metadata-only (no compilation), so it runs in seconds
# and needs no target caching.
#
# On the REQUIRED PR gate: `cargo-deny` is one of the fast checks branch
# protection requires (fmt/clippy/test/cargo-deny/seal-smoke). It also runs on
# push-to-main and nightly, offset from ci.yml's 04:00 UTC sweep so a newly
# published advisory against an unchanged tree is still caught.
#
# GATING, not advisory. A real finding fails the workflow. Prior art ran this
# advisory-only (fearing a fix-less CVE pins CI red forever) — but `deny.toml`
# supports a documented, justified ignore-list for exactly that case (see the
# repo-root `deny.toml`), so a real unfixable advisory is an explicit, reviewed
# exception, not a downgraded gate. A silently-ignored NEW vulnerability is
# worse than an occasionally-red CI run.
#
# Why NOT Miri here: cargo-deny checks third-party dependency metadata
# (advisories/licenses/registry provenance), orthogonal to Miri (UB in OUR
# code's execution). Miri has its own scoped job in ci.yml.
# ─────────────────────────────────────────────────────────────────────────────
name: Supply-chain security

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '13 5 * * *'       # nightly, offset from ci.yml's 04:00 UTC sweep
  workflow_dispatch: {}

# Least-privilege GITHUB_TOKEN, capped at the top so a fork PR run cannot inherit
# a broader default. The one job here only reads Cargo.lock/metadata and runs
# `cargo-deny` — no API write, no checkout of PR-head code beyond the standard
# read — so read-only `contents` is the whole need and the only scope reachable.
permissions:
  contents: read

# A push run is keyed by its commit: GitHub replaces a queued run (and
# cancel-in-progress cancels a running one) when a newer run joins its group,
# so a per-ref push group would let one main commit go unbuilt.
concurrency:
  group: security-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # RustSec advisories + license compliance + dependency-source pinning +
  # duplicate-version report against the `--features full` graph (matches
  # ci.yml's `runtime-full-features` job — the actual shipped feature surface,
  # not the narrow default-feature slice `cargo test` alone would see).
  # Deliberately NOT `--all-features`: `webview` (wry/tao/GTK3) is excluded
  # from `full` by design (runtime/Cargo.toml) and would inject a large, noisy,
  # platform-gated dependency surface that no CI job or generated project
  # builds. `deny.toml` at the repo root carries the full rationale per section.
  #
  # Part of the FAST required PR gate — job name `cargo-deny` is a required
  # status check under branch protection.
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain-pinned
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories bans licenses sources
