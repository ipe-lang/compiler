# Drift gate for the tree-sitter-ipe grammar: the grammar must accept every
# reference source the compiler accepts. Regenerates the parser, runs the
# corpus unit tests, and parses all examples/** and src/stdlib/Ipe/** — failing
# on any ERROR/MISSING node. The tree-sitter CLI installs through the Rust
# toolchain (cargo install), so no separate JS toolchain is required.
name: tree-sitter-ipe

on:
  push:
    branches: [main]
    paths:
      - 'editors/tree-sitter-ipe/**'
      - 'examples/**/*.ipe'
      - 'src/stdlib/Ipe/**/*.ipe'
      - '.github/workflows/tree-sitter-ipe.yml'
  pull_request:
  merge_group:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tested merge commit and its base parent, for the changed-path diff;
          # a merge-group run needs history back to the queue base.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '2' }}

      # Fail-closed classifier (.github/ci/change_class.py, `grammar` scope): the
      # work skips only when every changed path is proven irrelevant.
      - name: Classify changed paths
        id: classify
        # A crash leaves the output unset, which every `!= 'false'` below reads as run.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: python3 .github/ci/change_class.py --grammar

      - uses: ./.github/actions/rust-toolchain-pinned
        if: steps.classify.outputs.grammar != 'false'

      # Every run restores the CLI; only `main` saves it: a cache saved under
      # any other ref is one no later run reads, and it evicts the ones `main`
      # wrote (verify-manifest check 6).
      - name: Restore the tree-sitter CLI
        id: ts-cli
        if: steps.classify.outputs.grammar != 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/tree-sitter
          key: tree-sitter-cli-0.27.0

      - name: Install the tree-sitter CLI
        if: steps.classify.outputs.grammar != 'false'
        run: |
          if ! command -v tree-sitter >/dev/null 2>&1; then
            cargo install tree-sitter-cli --version ^0.27.0 --locked
          fi
          tree-sitter --version

      - name: Save the tree-sitter CLI
        if: github.ref == 'refs/heads/main' && steps.classify.outputs.grammar != 'false' && steps.ts-cli.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/tree-sitter
          key: ${{ steps.ts-cli.outputs.cache-primary-key }}

      - name: Generate the parser
        if: steps.classify.outputs.grammar != 'false'
        working-directory: editors/tree-sitter-ipe
        run: tree-sitter generate

      - name: Corpus unit tests
        if: steps.classify.outputs.grammar != 'false'
        working-directory: editors/tree-sitter-ipe
        run: tree-sitter test

      - name: Parity — parse the whole reference corpus
        if: steps.classify.outputs.grammar != 'false'
        run: bash editors/tree-sitter-ipe/scripts/parity-check.sh

      - name: No grammar-relevant paths changed
        if: steps.classify.outputs.grammar == 'false'
        run: echo "No tree-sitter-ipe-relevant paths changed; gate is a no-op for this PR."
