name: CI
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  wasi-confinement-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/rust-toolchain-pinned
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@23d41aa71228a2692ee31bb433f070fd4bdc6661 # nextest
        with:
          tool: nextest@0.9.146
      - name: Run the WASI preopen confinement tests on macOS
        run: cargo nextest run --locked -p ipe --features wasi_run --profile ci --test wasi_target_seal --no-tests=fail -E 'test(/^preopen_confinement_/)'
