# Proves install.sh actually downloads, extracts, and installs a working `ipe` on
# every platform it claims to support — Linux, macOS, Windows (Git Bash), and
# FreeBSD — using the documented `curl … | sh` delivery, then exercises the
# `ipe upgrade` self-updater. A published release must exist for the installer to
# fetch, so this runs post-merge, on a weekly schedule, and on any PR that touches
# the installer. Advisory (not a required gate); it guards the install path from
# silent rot across OSes.
name: Install

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - '.github/workflows/install-smoke.yml'
  pull_request:
    paths:
      - 'install.sh'
      - '.github/workflows/install-smoke.yml'
  schedule:
    - cron: '19 6 * * 1'      # Mondays, offset from the other scheduled jobs
  workflow_dispatch: {}

# Read-only: the smoke only fetches a public release and runs the binary.
permissions:
  contents: read

# A push run is keyed by its commit: GitHub replaces a queued run (and
# cancel-in-progress cancels a running one) when a newer run joins its group,
# so a per-ref push group would let one main commit go unbuilt.
concurrency:
  group: install-smoke-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub-hosted runners cover Linux, macOS (arm64), and Windows via Git Bash.
  hosted:
    name: install-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ipe via the documented `curl … | sh`, then verify `ipe upgrade`
        shell: bash
        env:
          IPE_INSTALL_DIR: ${{ runner.temp }}/ipe-smoke
          # Authenticate install.sh's `releases/latest` lookup so the shared
          # runner IP is not anonymously rate-limited (403). Scope is contents:read.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Replicate the documented one-liner `curl -fsSL … | sh`: deliver the
          # installer on stdin (no `$0` file), exactly as a real user runs it.
          cat install.sh | sh
          # Git Bash on Windows installs ipe.exe; resolve either name.
          bin="$IPE_INSTALL_DIR/ipe"
          [ -x "$bin" ] || bin="$bin.exe"
          "$bin" version
          # Replicate the `ipe upgrade` self-updater: --dry-run must print the same
          # one-liner, pointing at the root install.sh on main.
          "$bin" upgrade --dry-run | grep -F "/main/install.sh"

  # No hosted FreeBSD runner exists, so drive the same installer inside a
  # FreeBSD VM on a Linux host — a real freebsd-x64 download + run, not a proxy.
  freebsd:
    name: install-smoke (freebsd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install ipe via the documented `curl … | sh` inside a FreeBSD VM
        uses: vmactions/freebsd-vm@a2f9a41fa97f6848b8c3b791087dfcdaa5b473ff # v1.5.8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          usesh: true
          # Copy the host token into the VM so install.sh's release lookup is
          # authenticated (avoids anonymous API rate-limit 403).
          envs: 'GITHUB_TOKEN'
          prepare: pkg install -y curl
          run: |
            set -eu
            export IPE_INSTALL_DIR="$HOME/ipe-smoke"
            cat install.sh | sh
            "$IPE_INSTALL_DIR/ipe" version
            "$IPE_INSTALL_DIR/ipe" upgrade --dry-run | grep -F "/main/install.sh"
