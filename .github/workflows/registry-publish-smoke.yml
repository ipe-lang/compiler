# Live-registry publish smoke test — exercise the real `ipe package publish`
# push-path end-to-end against the live (or a staging) registry.
#
# The `registry-admission` CI job (ci.yml) proves the publish *logic* over a
# LOCAL fixture index — no real registry. This workflow closes that gap by driving
# the actual network push-path in BOTH directions: a clean probe `ipe package
# publish`es, the registry's admission workflow ACCEPTS it, and the entry resolves
# back through the Pages read API; then a deliberately-bad probe (a hidden
# `network` capability) is published the same way and the same admission workflow
# REJECTS it (its PR check goes RED / the PR is closed, never merged). Both legs
# then clean up idempotently so the real index is never polluted. See
# tools/scripts/registry/publish-smoke.sh for the mechanism.
#
# Cadence: NIGHTLY (cron) + manual `workflow_dispatch` ONLY. Never per-PR, never a
# promotion-required check — pushing to a real registry must not gate every PR or
# promotion. This workflow is advisory: a red run signals a broken live push-path,
# it does not block a merge or a release.
#
# Trust boundary (why this is guardian-reviewed): it uses a publish token — the
# IPE_REGISTRY_PUBLISH_TOKEN repo secret — to push a branch and open a PR on the
# registry. The token is passed to the smoke script ONLY through the environment;
# the script never echoes it, never writes it to a logged file, and never places
# it on a process argv (git gets it via GIT_ASKPASS, the API via the Authorization
# header). `set -x` is never enabled. The run is fail-closed: any auth, admission,
# or resolution failure turns the job RED — never green-by-skip.
#
# Staging vs production: PREFER a staging registry (a throwaway repo mirroring the
# ipe-registry layout) so a failed run can never corrupt the real index. Configure
# it with the IPE_SMOKE_INDEX_REPO / IPE_SMOKE_REGISTRY_URL repo variables. With no
# staging repo configured, the run falls back to the production registry using
# RESERVED disposable package names (`ipe-registry-smoke-probe` for the clean
# probe, `ipe-registry-smoke-probe-bad` for the negative leg — both `0.0.0-smoke*`
# prereleases no real consumer depends on) plus guaranteed idempotent cleanup. The
# bad probe is rejected by admission, so its PR never merges.
#
# Required infra for a live run (absent → the job fails-closed with a clear note):
#   secret  IPE_REGISTRY_PUBLISH_TOKEN  publish token with push + open-PR rights on
#                                       the index repo and the fork.
#   secret  IPE_REGISTRY_SIGNING_KEY    the SSH signing PRIVATE key whose `.pub` is
#                                       registered as a *signing* key on the
#                                       publishing GitHub account. The curated index
#                                       merges only signed commits, so publish
#                                       refuses without it. For the resulting commit
#                                       to be GitHub-"Verified", the publish commit's
#                                       committer email must be a verified email on
#                                       that same account — see the commit-identity
#                                       note below.
#
# Commit-identity note: `ipe package publish` currently commits the index PR with a
# fixed identity (`ipe <ipe@localhost>`). GitHub marks an SSH-signed commit
# "Verified" only when the committer email is a verified email on the account that
# owns the registered signing key; `ipe@localhost` never is. Resolving that — making
# the publish committer identity match the signing account — is a design decision
# tracked in the deferred issue and is NOT wired here; provisioning the key alone
# does not by itself make the commit Verified.
#   var     IPE_SMOKE_INDEX_REPO        <owner>/<name> the PR targets
#                                       (default arthurmaciel/ipe-registry).
#   var     IPE_SMOKE_FORK              fork owner the publish branch is pushed to
#                                       (default: the index repo owner).
#   var     IPE_SMOKE_REGISTRY_URL      Pages read API base
#                                       (default https://arthurmaciel.github.io/ipe-registry).
#   var     IPE_SMOKE_SOURCE_REPO       disposable repo whose HEAD the entry pins
#                                       (default: <fork>/ipe-registry-smoke-probe).
#   var     IPE_SMOKE_BAD_SOURCE_REPO   disposable repo for the negative leg's bad
#                                       probe source (default:
#                                       <fork>/ipe-registry-smoke-probe-bad).
name: Registry publish smoke

on:
  schedule:
    # 05:12 UTC — a quiet-hours slot offset from the other nightly crons
    # (ci nightly 04:00, sandbox 03:17) so the scheduled runs do not pile up.
    - cron: '12 5 * * *'
  workflow_dispatch: {}

# Read-only at the workflow level: the smoke's registry writes are authorized by
# the publish token secret, NOT by the workflow GITHUB_TOKEN, so this workflow's
# own token needs no write scope.
permissions:
  contents: read

concurrency:
  # One live smoke at a time — two concurrent runs would race on the reserved
  # package's branch/PR. Do not cancel an in-flight run (it owns cleanup).
  group: registry-publish-smoke
  cancel-in-progress: false

jobs:
  publish-smoke:
    name: publish → admit clean + reject bad → cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/rust-toolchain-pinned
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the ipe binary
        env:
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
        run: cargo build -p ipe --bin ipe

      # `ipe package publish` previews the Tier-1 supply-chain scan (RUSTSEC
      # advisories + bans over the Rust dependency graph) via cargo-deny; absent
      # it that scan is skipped with a warning. Install it so the smoke's publish
      # preview is byte-faithful to the authoritative gate, which also runs it.
      - name: Install cargo-deny (supply-chain advisory + bans enforcement)
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-deny@0.20.2

      # Fail closed BEFORE running the smoke when the publish token OR the commit
      # signing key is absent, so the reason is an obvious job-summary line, not an
      # opaque mid-run error. The curated index only merges SIGNED commits, so
      # `ipe package publish` refuses up front without a signing key — the smoke
      # needs both secrets to exercise the live push-path.
      - name: Verify the publish secrets are present (fail-closed)
        env:
          TOKEN_PRESENT: ${{ secrets.IPE_REGISTRY_PUBLISH_TOKEN != '' }}
          SIGNING_KEY_PRESENT: ${{ secrets.IPE_REGISTRY_SIGNING_KEY != '' }}
        run: |
          missing=""
          [ "$TOKEN_PRESENT" = "true" ] || missing="$missing IPE_REGISTRY_PUBLISH_TOKEN"
          [ "$SIGNING_KEY_PRESENT" = "true" ] || missing="$missing IPE_REGISTRY_SIGNING_KEY"
          if [ -n "$missing" ]; then
            {
              echo "### Registry publish smoke — NOT RUN"
              echo
              echo "Missing required repo secret(s):$missing"
              echo
              echo "The live push-path needs:"
              echo "- \`IPE_REGISTRY_PUBLISH_TOKEN\` — a publish token with push + open-PR rights."
              echo "- \`IPE_REGISTRY_SIGNING_KEY\`  — the SSH signing PRIVATE key whose \`.pub\` is"
              echo "  registered as a *signing* key on the publishing GitHub account, so the"
              echo "  index PR's commit is GitHub-\"Verified\" and admission can merge it."
              echo
              echo "This is a fail-closed skip, not a passing proof."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::missing publish secret(s):$missing — cannot run the live-registry publish smoke (fail-closed)."
            exit 1
          fi

      # Materialise the SSH signing private key to a mode-600 file OUTSIDE the
      # workspace and export its path as CI_JOB_PUBLISH_SIGNING_KEY; the next step
      # hands it to `ipe package publish` as IPE_PUBLISH_SIGNING_KEY. The secret is written by the runner's own
      # secret-masking `run` step — never echoed, never on an argv, never under
      # `set -x` — and the file lives under RUNNER_TEMP, which the runner wipes at
      # job end. Only the PATH is exported; the key bytes never reach a log.
      - name: Provision the commit signing key (never logged)
        env:
          IPE_REGISTRY_SIGNING_KEY: ${{ secrets.IPE_REGISTRY_SIGNING_KEY }}
        run: |
          KEY_FILE="$RUNNER_TEMP/ipe-publish-signing-key"
          install -m 600 /dev/null "$KEY_FILE"
          printf '%s\n' "$IPE_REGISTRY_SIGNING_KEY" > "$KEY_FILE"
          bash "$GITHUB_WORKSPACE/.github/ci/github-env.sh" CI_JOB_PUBLISH_SIGNING_KEY "$KEY_FILE"

      - name: Run the live publish smoke
        env:
          # The token is delivered ONLY here, on the environment. The script never
          # echoes it, never logs it, never puts it on an argv.
          IPE_SMOKE_TOKEN: ${{ secrets.IPE_REGISTRY_PUBLISH_TOKEN }}
          # The key path the previous step exported (github-env.sh), under the
          # name `ipe package publish` reads, so it signs the index-PR commit;
          # without it publish fail-closes on an unsigned commit the curated
          # index rejects.
          IPE_PUBLISH_SIGNING_KEY: ${{ env.CI_JOB_PUBLISH_SIGNING_KEY }}
          # Staging overrides fall through to the script's production defaults when
          # the repo variables are unset.
          IPE_SMOKE_INDEX_REPO: ${{ vars.IPE_SMOKE_INDEX_REPO }}
          IPE_SMOKE_FORK: ${{ vars.IPE_SMOKE_FORK }}
          IPE_REGISTRY_URL: ${{ vars.IPE_SMOKE_REGISTRY_URL }}
          IPE_SMOKE_SOURCE_REPO: ${{ vars.IPE_SMOKE_SOURCE_REPO }}
          # The negative leg's bad-probe source repo (optional; the script defaults
          # to <fork>/ipe-registry-smoke-probe-bad when unset).
          IPE_SMOKE_BAD_SOURCE_REPO: ${{ vars.IPE_SMOKE_BAD_SOURCE_REPO }}
          IPE_BIN: ${{ github.workspace }}/target/debug/ipe
          IPE_RUNTIME_DIR: ${{ github.workspace }}/src/runtime/rust/src
        run: bash tools/scripts/registry/publish-smoke.sh
