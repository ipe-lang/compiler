id = "ipe"
name = "Ipê"
description = "Ipê language support for Zed: syntax highlighting (tree-sitter) and the ipe LSP."
version = "0.2.0"
schema_version = 1
authors = ["Arthur Maciel <arthurmaciel@gmail.com>"]
repository = "https://github.com/ipe-lang/compiler"

[grammars.ipe]
# Filled in by editors/zed/configure.sh with the source and the commit the
# assembled highlight query came from, so Zed's grammar checkout and the query
# are always one revision. A stored commit could not name a grammar change's
# own landing commit, and would go stale on every change.
repository = "@IPE_GRAMMAR_REPOSITORY@"
rev = "@IPE_GRAMMAR_REV@"
path = "editors/tree-sitter-ipe"

[language_servers.ipe-lsp]
name = "Ipê LSP"
languages = ["Ipê"]
language_ids = { "Ipê" = "ipe" }
