[package]
name = "basics___IPE_CRATE_HASH__"
version = "0.1.0"
edition = "2024"

[features]
default = []
alloc_dlmalloc = ["dep:dlmalloc"]
alloc_mimalloc = ["dep:mimalloc"]

[dependencies]
dlmalloc = { version = "0.2", features = ["global"], optional = true }
mimalloc = { version = "0.1", optional = true, default-features = false }
# The Ipê runtime, bundled alongside this crate under `ipe_runtime_dep/`.
# A relative path dependency: `cargo build` works in any environment
# (cross-compiler container, offline, CI) because the source is local.
ipe_runtime = { package = "ipe-runtime-rust", path = "__IPE_RUNTIME_PATH__", default-features = false, features = [] }

[profile.dev]
debug = 0
incremental = true
overflow-checks = false

[profile.release]
strip = true

# Detach this generated crate from any ancestor cargo workspace so it builds
# hermetically even when emitted inside another workspace tree.
[workspace]
